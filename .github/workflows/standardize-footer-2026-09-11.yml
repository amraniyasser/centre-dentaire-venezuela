name: Standardize compact footer 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/standardize-footer-2026-09-11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize footer across all pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          footer = '''<footer class="cv-footer">
  <div class="cv-footer__inner">
    <div class="cv-footer__identity">
      <a class="cv-footer__brand" href="/">Centre Dentaire<span>Venezuela</span></a>
      <p class="cv-footer__about">Cabinet dentaire à Tanger · 4ème étage n°74, Immeuble Venezuela, 89 Rue Moussa Ben Noussair, Tanger 90000.</p>
      <div class="cv-footer__contact-list">
        <a href="tel:+212531112127"><span>Téléphone</span><strong>+212 5 31 11 21 27</strong></a>
        <a href="https://wa.me/212771158018" target="_blank" rel="noopener"><span>WhatsApp</span><strong>+212 771 158 018</strong></a>
      </div>
    </div>

    <nav class="cv-footer__care" aria-label="Soins dentaires">
      <p class="cv-footer__head">Nos soins</p>
      <div class="cv-footer__links">
        <a href="/soins-dentaires-tanger/">Soins généraux</a>
        <a href="/chirurgie-dentaire-tanger/">Chirurgie dentaire</a>
        <a href="/dentisterie-esthetique-tanger/">Dentisterie esthétique</a>
        <a href="/blanchiment-dentaire-tanger/">Blanchiment dentaire</a>
        <a href="/implant-dentaire-tanger/">Implantologie</a>
        <a href="/endodontie-tanger/">Endodontie</a>
        <a href="/parodontologie-tanger/">Parodontologie</a>
        <a href="/orthodontie-tanger/">Orthodontie</a>
      </div>
    </nav>

    <div class="cv-footer__right">
      <div>
        <p class="cv-footer__head">Suivez-nous</p>
        <div class="cv-footer__socials">
          <a href="https://www.instagram.com/centre.dentaire.venezuela/" target="_blank" rel="noopener" aria-label="Instagram du Centre Dentaire Venezuela">Instagram</a>
          <a href="https://www.tiktok.com/@centredentairevenezuela" target="_blank" rel="noopener" aria-label="TikTok du Centre Dentaire Venezuela">TikTok</a>
          <a href="https://maps.app.goo.gl/6SJrWgcmshbDhSLH7" target="_blank" rel="noopener" aria-label="Google Maps du Centre Dentaire Venezuela">Google</a>
        </div>
      </div>
      <div class="cv-footer__hours">
        <p class="cv-footer__head">Horaires</p>
        <p><b>Lun · Mer · Ven</b> 9h30–17h30<br><b>Mar · Jeu</b> 9h30–13h · 15h–18h30<br><b>Sam</b> 10h–14h · <b>Dim</b> fermé</p>
      </div>
    </div>
  </div>

  <div class="cv-footer__bottom">
    <span>© 2026 Centre Dentaire Venezuela</span>
    <span class="cv-footer__bottom-links"><a href="/mentions-legales/">Mentions légales</a><a href="/politique-confidentialite/">Politique de confidentialité</a><a href="/#rdv">Prendre rendez-vous</a></span>
    <span>Site réalisé par <span class="cv-footer__credit">Y&amp;N Growth</span></span>
  </div>
</footer>'''

          css = '''<style id="cv-footer-styles">
.cv-footer{background:#143b3e;color:#fff}
.cv-footer a{color:inherit;text-decoration:none}
.cv-footer__inner{max-width:1400px;margin:0 auto;padding:30px 4.6% 24px;display:grid;grid-template-columns:1.25fr 1fr .95fr;gap:34px}
.cv-footer__brand{display:block;font-size:20px;font-weight:600;line-height:1.08}.cv-footer__brand span{display:block;color:#c3dfdc}
.cv-footer__about{margin:10px 0 14px;max-width:44ch;font-size:12.5px;line-height:1.55;color:rgba(255,255,255,.62)}
.cv-footer__contact-list{display:flex;flex-direction:column;gap:7px}.cv-footer__contact-list a{display:flex;align-items:baseline;gap:8px;width:fit-content}.cv-footer__contact-list span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8fb5b1}.cv-footer__contact-list strong{font-size:13.5px;font-weight:600}
.cv-footer__head{margin:0 0 10px;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8fb5b1}
.cv-footer__links{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px}.cv-footer__links a{font-size:12.5px;color:rgba(255,255,255,.74)}.cv-footer__links a:hover{color:#fff}
.cv-footer__right{display:flex;flex-direction:column;gap:18px}.cv-footer__socials{display:flex;gap:8px;flex-wrap:wrap}.cv-footer__socials a{padding:7px 10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;font-size:11.5px;color:#c3dfdc}.cv-footer__socials a:hover{background:rgba(255,255,255,.08)}
.cv-footer__hours p{margin:0;font-size:12px;line-height:1.65;color:rgba(255,255,255,.66)}.cv-footer__hours b{color:rgba(255,255,255,.9);font-weight:600}
.cv-footer__bottom{border-top:1px solid rgba(255,255,255,.1);padding:11px 4.6%;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:10.5px;color:rgba(255,255,255,.48)}
.cv-footer__bottom-links{display:flex;gap:14px;flex-wrap:wrap}.cv-footer__bottom-links a:hover{color:#fff}.cv-footer__credit{color:#e5bd8c;font-weight:600}
@media(max-width:900px){.cv-footer__inner{grid-template-columns:1fr 1fr}.cv-footer__right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}}
@media(max-width:640px){.cv-footer__inner{padding:24px 20px 20px;grid-template-columns:1fr;gap:24px}.cv-footer__right{grid-column:auto;display:flex}.cv-footer__links{grid-template-columns:1fr 1fr}.cv-footer__bottom{padding:11px 20px;align-items:flex-start;flex-direction:column;gap:7px}}
</style>'''

          html_files=[p for p in Path('.').rglob('*.html') if '.github' not in p.parts]
          changed=[]
          for p in html_files:
              s=p.read_text(encoding='utf-8')
              # Remove any previous standardized footer CSS before reinserting once.
              s=re.sub(r'<style id="cv-footer-styles">.*?</style>','',s,flags=re.S)
              # Replace the first complete footer with the canonical footer.
              if re.search(r'<footer\b.*?</footer>',s,flags=re.S|re.I):
                  s=re.sub(r'<footer\b.*?</footer>',footer,s,count=1,flags=re.S|re.I)
              elif '</body>' in s:
                  s=s.replace('</body>',footer+'\n</body>',1)
              else:
                  continue
              # Remove legacy footer extra blocks that may sit outside old footers.
              s=re.sub(r'<div class="site-footer-extra".*?</div></div>','',s,flags=re.S)
              # Inject shared footer CSS in each page head so the visual is identical.
              if '</head>' in s:
                  s=s.replace('</head>',css+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))

          # Permanent project rule for future pages.
          rule_path=Path('.github/project-docs/instructions-projet-centre-dentaire-venezuela.md')
          if rule_path.exists():
              r=rule_path.read_text(encoding='utf-8')
              marker='## Footer canonique — règle obligatoire'
              rule='''\n\n## Footer canonique — règle obligatoire\n- Toute nouvelle page HTML doit reprendre exactement le footer canonique déjà présent sur les pages du site.\n- Ne pas créer de variante de footer par page.\n- Le footer doit toujours afficher le téléphone du cabinet puis le WhatsApp +212 771 158 018 juste en dessous.\n- Réseaux obligatoires : Instagram, TikTok et Google Maps.\n- Liens obligatoires : Mentions légales, Politique de confidentialité et prise de rendez-vous.\n- Le footer doit rester compact : pas d'espace vertical excessif au-dessus ou sous son contenu.\n'''
              if marker not in r:
                  rule_path.write_text(r.rstrip()+rule+'\n',encoding='utf-8')

          # QA: all HTML pages have exactly one canonical footer and WhatsApp.
          for p in html_files:
              s=p.read_text(encoding='utf-8')
              assert s.count('class="cv-footer"') == 1, f'footer count: {p}'
              assert '+212 771 158 018' in s, f'WhatsApp missing: {p}'
              assert '/mentions-legales/' in s and '/politique-confidentialite/' in s, f'legal links missing: {p}'
          print('Updated', len(changed), 'HTML files')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Standardize compact footer site-wide with WhatsApp' || exit 0
          git push
