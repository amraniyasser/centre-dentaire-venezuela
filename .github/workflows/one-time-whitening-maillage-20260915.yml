name: One-time whitening cluster linking cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-whitening-maillage-20260915.yml'

permissions:
  contents: write

jobs:
  update-whitening-cluster:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SEO internal-linking cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          # 1) Keep the guide aligned with its title: 7 points, not 8.
          p = Path('blog/blanchiment-dentaire-guide/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<h2>8\. Prix et méthode : pourquoi deux offres de blanchiment ne se comparent pas toujours</h2><p>.*?</p><p>.*?</p>\n(?=<div class="callout"><b>Vous préparez un mariage \?</b>)'
          s, n = re.subn(pattern, '', s, count=1, flags=re.S)
          assert n == 1, f'Guide: section 8 removal matched {n} times'
          assert s.count('"dateModified":"2026-09-13"') == 1
          s = s.replace('"dateModified":"2026-09-13"', '"dateModified":"2026-09-15"', 1)
          assert s.count('Mis à jour le 13 septembre 2026') == 1
          s = s.replace('Mis à jour le 13 septembre 2026', 'Mis à jour le 15 septembre 2026', 1)
          p.write_text(s, encoding='utf-8')

          # 2) Add a genuinely contextual link from general dental care/detartrage to whitening.
          p = Path('soins-dentaires-tanger/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>La consultation peut concerner un contrôle, un détartrage, une carie, une dent sensible ou une restauration à reprendre. L’examen clinique permet de hiérarchiser les besoins et d’expliquer les soins utiles avant toute intervention. Lorsqu’une carie atteint la pulpe, un <a href="/endodontie-tanger/">traitement endodontique</a> peut être nécessaire.</p>'
          new = old + '<p>Le détartrage retire le tartre et les dépôts, mais il ne modifie pas la teinte naturelle de la dent. Lorsque l’objectif est d’éclaircir la couleur des dents naturelles, consultez notre page sur le <a href="/blanchiment-dentaire-tanger/">blanchiment dentaire professionnel à Tanger</a>.</p>'
          assert s.count(old) == 1, f'Soins: insertion anchor matched {s.count(old)} times'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Connect the commercial whitening page visibly to Dr Majda's profile.
          p = Path('blanchiment-dentaire-tanger/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<section class="section"><div class="inner"><div class="section-head"><span class="kicker">À Tanger</span><h2>Faire un blanchiment au Centre Dentaire Venezuela</h2><p class="lead">Le cabinet est situé au 4ème étage n°74, Immeuble Venezuela, 89 Rue Moussa Ben Noussair, Tanger 90000. Les consultations peuvent se faire en français, arabe, anglais ou espagnol.</p></div><div class="related">'
          new = '<section class="section"><div class="inner"><div class="section-head"><span class="kicker">À Tanger</span><h2>Faire un blanchiment au Centre Dentaire Venezuela</h2><p class="lead">Le cabinet est situé au 4ème étage n°74, Immeuble Venezuela, 89 Rue Moussa Ben Noussair, Tanger 90000. Les consultations peuvent se faire en français, arabe, anglais ou espagnol.</p></div><p>La prise en charge est réalisée au Centre Dentaire Venezuela après examen clinique. Pour découvrir le parcours de la praticienne du centre, consultez le profil de <a href="/dr-majda-laasraoui-dentiste-tanger/">Dr Majda Laasraoui, chirurgienne-dentiste à Tanger</a>.</p><div class="related">'
          assert s.count(old) == 1, f'Whitening service: Dr Majda insertion matched {s.count(old)} times'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Keep one strong exact-match internal anchor in the comparison article and vary the others naturally.
          p = Path('blog/flash-opalescence-philips-zoom-blanchiment/index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '<a href="/blanchiment-dentaire-tanger/"><strong>blanchiment dentaire à Tanger</strong></a>'
          parts = s.split(anchor)
          assert len(parts) == 5, f'Comparison: expected 4 exact-match anchors, found {len(parts)-1}'
          variants = [
              anchor,
              '<a href="/blanchiment-dentaire-tanger/"><strong>sur le blanchiment professionnel</strong></a>',
              '<a href="/blanchiment-dentaire-tanger/"><strong>traitement de blanchiment au cabinet</strong></a>',
              '<a href="/blanchiment-dentaire-tanger/"><strong>dédiée au blanchiment professionnel</strong></a>',
          ]
          s = parts[0] + variants[0] + parts[1] + variants[1] + parts[2] + variants[2] + parts[3] + variants[3] + parts[4]
          assert s.count('"dateModified":"2026-09-13"') == 1
          s = s.replace('"dateModified":"2026-09-13"', '"dateModified":"2026-09-15"', 1)
          assert s.count('Mis à jour le 13 septembre 2026') == 1
          s = s.replace('Mis à jour le 13 septembre 2026', 'Mis à jour le 15 septembre 2026', 1)
          p.write_text(s, encoding='utf-8')

          # 5) Refresh sitemap lastmod only for pages actually modified today.
          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          urls = [
              'https://centredentairevenezuela.com/soins-dentaires-tanger/',
              'https://centredentairevenezuela.com/blanchiment-dentaire-tanger/',
              'https://centredentairevenezuela.com/blog/blanchiment-dentaire-guide/',
              'https://centredentairevenezuela.com/blog/flash-opalescence-philips-zoom-blanchiment/',
          ]
          for url in urls:
              old = f'<url><loc>{url}</loc><lastmod>2026-09-13</lastmod></url>'
              new = f'<url><loc>{url}</loc><lastmod>2026-09-15</lastmod></url>'
              assert s.count(old) == 1, f'Sitemap: expected one entry for {url}'
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Validation: semantic targets and structured data remain sound.
          guide = Path('blog/blanchiment-dentaire-guide/index.html').read_text(encoding='utf-8')
          assert '<h2>8.' not in guide
          assert 'Avant un blanchiment dentaire : 7 choses à savoir' in guide

          soins = Path('soins-dentaires-tanger/index.html').read_text(encoding='utf-8')
          assert 'blanchiment dentaire professionnel à Tanger</a>' in soins

          service = Path('blanchiment-dentaire-tanger/index.html').read_text(encoding='utf-8')
          assert '<a href="/dr-majda-laasraoui-dentiste-tanger/">Dr Majda Laasraoui, chirurgienne-dentiste à Tanger</a>' in service

          comparison = Path('blog/flash-opalescence-philips-zoom-blanchiment/index.html').read_text(encoding='utf-8')
          assert comparison.count(anchor) == 1
          assert 'Mis à jour le 15 septembre 2026' in comparison

          for file in [
              'blog/blanchiment-dentaire-guide/index.html',
              'blog/flash-opalescence-philips-zoom-blanchiment/index.html',
              'blanchiment-dentaire-tanger/index.html',
              'soins-dentaires-tanger/index.html',
          ]:
              txt = Path(file).read_text(encoding='utf-8')
              for raw in re.findall(r'<script type="application/ld\+json">(.*?)</script>', txt, flags=re.S):
                  json.loads(raw)

          print('Whitening cluster cleanup validated successfully.')
          PY

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/blanchiment-dentaire-guide/index.html \
                  blog/flash-opalescence-philips-zoom-blanchiment/index.html \
                  blanchiment-dentaire-tanger/index.html \
                  soins-dentaires-tanger/index.html \
                  sitemap.xml
          git rm .github/workflows/one-time-whitening-maillage-20260915.yml
          git commit -m "Improve whitening cluster internal linking"
          git push origin HEAD:main
