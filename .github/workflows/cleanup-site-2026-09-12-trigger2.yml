name: Cleanup rollout
on:
  push:
    paths:
      - '.github/workflows/cleanup-site-2026-09-12-trigger2.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/cleanup_site_2026_09_12.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean duplicated shell code and organize shared assets'
          git push
