name: Create SEO service pages

on:
  push:
    paths:
      - '.github/scripts/create_service_pages.py'
      - '.github/workflows/create-service-pages.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/create_service_pages.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml */index.html
          git commit -m "Create SEO service pages and internal links" || exit 0
          git push
