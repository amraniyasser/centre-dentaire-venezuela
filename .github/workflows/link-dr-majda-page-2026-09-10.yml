name: Link Dr Majda page 2026-09-10
on:
  push:
    paths:
      - '.github/workflows/link-dr-majda-page-2026-09-10.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add internal link from homepage practitioner section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          url='/dr-majda-laasraoui-dentiste-tanger/'
          if url not in s:
              anchor='''\n        <div class="cta-row" style="margin-top:24px">\n          <a class="cta primary" href="/dr-majda-laasraoui-dentiste-tanger/">Découvrir le parcours de Dr Majda <span class="chevron" aria-hidden="true">›</span></a>\n        </div>\n'''
              needle='''        </ul>\n      </div>\n\n    </div>\n  </section>\n\n  <!-- ===================== Cas réels ===================== -->'''
              if needle not in s:
                  raise SystemExit('Practitioner section insertion point not found')
              s=s.replace(needle,'        </ul>'+anchor+'      </div>\n\n    </div>\n  </section>\n\n  <!-- ===================== Cas réels ===================== -->',1)
              p.write_text(s,encoding='utf-8')
          assert url in p.read_text(encoding='utf-8')
          print('Homepage now links to Dr Majda page.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Link homepage to Dr Majda profile" && git push)
