name: Add FAQ everywhere 2026-09-10
on:
  push:
    paths:
      - '.github/workflows/add-faq-everywhere-2026-09-10.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add FAQs to missing pages
        run: python .github/scripts/add_faq_everywhere_2026_09_10.py || true
      - name: Validate visible FAQ on every indexable content page
        run: |
          python - <<'PY'
          from pathlib import Path
          missing=[]
          for p in Path('.').rglob('*.html'):
              if '.github' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8', errors='ignore')
              if 'name="robots"' in s and 'noindex' in s.lower():
                  continue
              low=s.lower()
              has_faq = ('data-site-faq="true"' in s) or (('<summary' in low) and (('faq' in low) or ('questions fréquentes' in low)))
              if not has_faq:
                  missing.append(str(p))
          if missing:
              raise SystemExit('Indexable pages without visible FAQ: ' + ', '.join(missing))
          print('FAQ present on every indexable content page.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blog/index.html blog/blanchiment-dentaire-guide/index.html
          git diff --cached --quiet || (git commit -m "Add FAQs to homepage and blog pages" && git push)
