name: Apply short SEO title

on:
  push:
    paths:
      - '.github/scripts/shorten_title_patch.py'
      - '.github/workflows/apply-short-title.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/shorten_title_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten homepage SEO title"
          git push
