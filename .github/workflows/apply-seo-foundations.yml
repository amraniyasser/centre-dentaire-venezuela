name: Apply SEO foundations

on:
  push:
    paths:
      - '.github/scripts/seo_foundations_patch.py'
      - '.github/workflows/apply-seo-foundations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/seo_foundations_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add canonical and strengthen dental schema"
          git push
