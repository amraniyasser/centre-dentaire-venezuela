name: Update orthodontics label

on:
  push:
    paths:
      - '.github/scripts/update_ortho_label.py'
      - '.github/workflows/apply-ortho-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update_ortho_label.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use multi-bagues wording for orthodontics" || exit 0
          git push
