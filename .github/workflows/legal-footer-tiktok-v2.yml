name: Legal footer TikTok
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply site updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t='https://www.tiktok.com/@centredentairevenezuela'
          p=Path('mentions-legales/index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<h2>Hébergement</h2><p>Le site est publié au moyen de GitHub Pages. Les services techniques d’hébergement sont fournis par GitHub.</p>','<h2>Hébergement et exploitation technique</h2><p>Le site est exploité sous le nom de domaine centredentairevenezuela.com. Pour toute question relative au fonctionnement du site ou à son contenu, vous pouvez contacter le Centre Dentaire Venezuela aux coordonnées indiquées sur cette page.</p>')
          p.write_text(s,encoding='utf-8')
          p=Path('politique-confidentialite/index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('Le site comporte des liens vers WhatsApp, Google Maps, Instagram, PubMed et d’autres services tiers.','Le site comporte des liens vers WhatsApp, Google Maps, Instagram, TikTok, PubMed et d’autres services tiers.')
          p.write_text(s,encoding='utf-8')
          block='<div class="site-footer-extra" style="border-top:1px solid rgba(255,255,255,.12);padding:18px 20px 22px;text-align:center;font-size:11.5px;line-height:1.8"><div class="site-footer-social" style="margin-bottom:6px"><a href="https://www.instagram.com/centre.dentaire.venezuela/" target="_blank" rel="noopener">Instagram</a> · <a href="https://www.tiktok.com/@centredentairevenezuela" target="_blank" rel="noopener">TikTok</a></div><div class="site-footer-legal"><a href="/mentions-legales/">Mentions légales</a> · <a href="/politique-confidentialite/">Politique de confidentialité</a></div></div>'
          for p in Path('.').rglob('*.html'):
              if '.github' in p.parts: continue
              s=p.read_text(encoding='utf-8')
              if 'class="site-footer-extra"' not in s:
                  s=re.sub(r'<div class="site-legal-links"[^>]*>.*?</div>',block,s,count=1,flags=re.S)
                  if 'class="site-footer-extra"' not in s and '</footer>' in s: s=s.replace('</footer>',block+'</footer>',1)
              if '"sameAs"' in s and t not in s:
                  s=s.replace('"https://www.instagram.com/centre.dentaire.venezuela/","https://maps.app.goo.gl/6SJrWgcmshbDhSLH7"','"https://www.instagram.com/centre.dentaire.venezuela/","https://www.tiktok.com/@centredentairevenezuela","https://maps.app.goo.gl/6SJrWgcmshbDhSLH7"')
              p.write_text(s,encoding='utf-8')
          assert 'GitHub' not in Path('mentions-legales/index.html').read_text(encoding='utf-8')
          assert 'GitHub' not in Path('politique-confidentialite/index.html').read_text(encoding='utf-8')
          assert t in Path('index.html').read_text(encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Structure footer and add TikTok" || exit 0
          git push
