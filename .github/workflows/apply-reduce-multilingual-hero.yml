name: Reduce multilingual hero text

on:
  push:
    paths:
      - '.github/scripts/reduce_multilingual_hero.py'
      - '.github/workflows/apply-reduce-multilingual-hero.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/reduce_multilingual_hero.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce multilingual hero label size" || exit 0
          git push
