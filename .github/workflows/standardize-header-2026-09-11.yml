name: Standardize canonical header
on:
  push:
    paths:
      - '.github/project-docs/standardize_header.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage header to all pages
        run: python3 .github/project-docs/standardize_header.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Standardize homepage header across all pages' || exit 0
          git push
