name: Link implant article
on:
  push:
    paths:
      - '.github/workflows/link-implant-article.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update blog hub, sitemap and implant page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          blog = Path('blog/index.html')
          b = blog.read_text(encoding='utf-8')
          card = '<article class="card" data-category="implantologie"><a href="/blog/implants-dentaires-2026-7-choses-a-savoir/"><div class="cover"><span class="tag">Implantologie</span><span class="scribble"></span><p class="cover-title">Implants dentaires en 2026 : 7 choses à savoir</p></div><div class="meta">13 sept. 2026</div><h2>Implants dentaires : longévité, douleur, cicatrisation et entretien</h2></a></article>'
          anchor = '<div class="grid" id="article-grid">'
          if '/blog/implants-dentaires-2026-7-choses-a-savoir/' not in b:
              b = b.replace(anchor, anchor + card, 1)
          b = re.sub(r'\n?/\* FAQ site-wide \*/\s*\.site-faq\{.*?@media\(max-width:680px\)\{\.site-faq\{padding:52px 20px\}\.site-faq summary\{font-size:15px\}\}\s*', '\n', b, flags=re.S)
          blog.write_text(b, encoding='utf-8')

          smp = Path('sitemap.xml')
          s = smp.read_text(encoding='utf-8')
          if 'implants-dentaires-2026-7-choses-a-savoir' not in s:
              s = s.replace('</urlset>', '  <url><loc>https://centredentairevenezuela.com/blog/implants-dentaires-2026-7-choses-a-savoir/</loc><lastmod>2026-09-13</lastmod></url>\n</urlset>')
          s = s.replace('<url><loc>https://centredentairevenezuela.com/blog/</loc><lastmod>2026-09-11</lastmod></url>', '<url><loc>https://centredentairevenezuela.com/blog/</loc><lastmod>2026-09-13</lastmod></url>')
          smp.write_text(s, encoding='utf-8')

          ipath = Path('implant-dentaire-tanger/index.html')
          ip = ipath.read_text(encoding='utf-8')
          if '/blog/implants-dentaires-2026-7-choses-a-savoir/' not in ip:
              block = '<section class="section alt"><div class="inner"><div class="section-head"><span class="kicker">Guide implantologie</span><h2>Avant un traitement implantaire</h2><p class="lead">Longévité, douleur, cicatrisation, pose immédiate, tabac et entretien : retrouvez les points essentiels dans notre guide <a href="/blog/implants-dentaires-2026-7-choses-a-savoir/"><strong>Implants dentaires en 2026 : 7 choses à savoir</strong></a>.</p></div></div></section>'
              marker = '<section class="site-faq"'
              pos = ip.find(marker)
              if pos == -1:
                  marker = '<section class="section alt"'
                  pos = ip.rfind(marker)
              if pos == -1:
                  raise RuntimeError('Could not find safe insertion point on implant page')
              ip = ip[:pos] + block + ip[pos:]
          ipath.write_text(ip, encoding='utf-8')

          art = Path('blog/implants-dentaires-2026-7-choses-a-savoir/index.html').read_text(encoding='utf-8')
          assert art.count('class="site-faq"') == 1
          assert art.count('class="blog-summary"') == 1
          assert art.count('<h1>') == 1
          assert '<link rel="canonical"' in art
          assert 'https://pubmed.ncbi.nlm.nih.gov/' in art
          assert 'reviewedBy' not in art
          assert '/implant-dentaire-tanger/' in art and '/parodontologie-tanger/' in art and '/chirurgie-dentaire-tanger/' in art
          assert '/blog/implants-dentaires-2026-7-choses-a-savoir/' in blog.read_text(encoding='utf-8')
          assert 'FAQ site-wide' not in blog.read_text(encoding='utf-8')
          print('SEO/GEO/internal-link audit passed')
          PY
      - name: Commit
        run: |
          git rm .github/workflows/link-implant-article.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/index.html sitemap.xml implant-dentaire-tanger/index.html
          git commit -m 'Link 2026 implant guide across site'
          git push