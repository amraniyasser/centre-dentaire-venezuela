name: Update orthodontics wording

on:
  push:
    paths:
      - '.github/scripts/update_ortho_text.py'
      - '.github/workflows/apply-ortho-text.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update_ortho_text.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify orthodontics options" || exit 0
          git push
