name: Add Microsoft Clarity 2026-09-10
on:
  push:
    paths:
      - '.github/workflows/add-microsoft-clarity-2026-09-10.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Clarity snippet to all HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = 'yg1s5pek4f'
          snippet = '''\n<!-- Microsoft Clarity -->\n<script type="text/javascript">\n    (function(c,l,a,r,i,t,y){\n        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};\n        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;\n        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);\n    })(window, document, "clarity", "script", "yg1s5pek4f");\n</script>\n'''

          changed=[]
          html_files=[]
          for p in Path('.').rglob('*.html'):
              if '.github' in p.parts:
                  continue
              html_files.append(p)
              s=p.read_text(encoding='utf-8')
              if marker in s:
                  continue
              if '</head>' not in s.lower():
                  raise SystemExit(f'Missing </head>: {p}')
              idx=s.lower().find('</head>')
              s=s[:idx] + snippet + s[idx:]
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          missing=[]
          duplicates=[]
          for p in html_files:
              s=p.read_text(encoding='utf-8')
              count=s.count(marker)
              if count == 0:
                  missing.append(str(p))
              elif count != 1:
                  duplicates.append(f'{p}:{count}')
          if missing or duplicates:
              raise SystemExit(f'Clarity validation failed. Missing={missing}, duplicates={duplicates}')
          print(f'Clarity present exactly once on {len(html_files)} HTML pages. Changed {len(changed)} files.')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git diff --cached --quiet || (git commit -m "Add Microsoft Clarity site-wide" && git push)
