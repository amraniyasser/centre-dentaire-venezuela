name: Add FAQ everywhere 2026-09-10
on:
  push:
    paths:
      - '.github/workflows/add-faq-everywhere-2026-09-10.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add and validate FAQs
        run: python .github/scripts/add_faq_everywhere_2026_09_10.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html blog/index.html blog/blanchiment-dentaire-guide/index.html
          git diff --cached --quiet || (git commit -m "Add FAQs to homepage and blog pages" && git push)
