name: Apply WhatsApp appointment form

on:
  push:
    paths:
      - '.github/scripts/patch_whatsapp.py'
      - '.github/workflows/apply-whatsapp-form.yml'

permissions:
  contents: write

jobs:
  patch-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch_whatsapp.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Route appointment form to WhatsApp"
          git push
