name: One-time publish whitening duration article

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-publish-whitening-duration-20260915.yml'

permissions:
  contents: write

jobs:
  publish-article:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover and run publish script
        shell: bash
        run: |
          git show HEAD^:.github/workflows/one-time-publish-whitening-duration-20260915.yml > /tmp/old-workflow.yml
          python - <<'PY'
          from pathlib import Path
          old = Path('/tmp/old-workflow.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit and remove one-time workflow"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          block = old[start:end]
          cleaned = []
          for line in block.splitlines():
              cleaned.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/publish_whitening_duration.py').write_text('\n'.join(cleaned) + '\n', encoding='utf-8')
          PY
          python /tmp/publish_whitening_duration.py

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/combien-de-temps-dure-un-blanchiment-dentaire/index.html \
                  assets/images/blog/duree-blanchiment-dentaire-reperes-etudes.svg \
                  assets/images/blog/duree-blanchiment-dentaire-facteurs.svg \
                  blog/index.html \
                  blanchiment-dentaire-tanger/index.html \
                  sitemap.xml
          git rm .github/workflows/one-time-publish-whitening-duration-20260915.yml
          git commit -m "Publish whitening duration guide with evidence and illustrations"
          git push origin HEAD:main
