name: Publish wedding article once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-wedding-article-once.yml'

permissions:
  contents: write

jobs:
  publish-wedding-article:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply internal linking and sitemap updates
        run: python .github/publish_wedding_article_once.py

      - name: Validate article and structured data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          files = [
              Path('blog/blanchiment-dentaire-avant-mariage/index.html'),
              Path('blog/index.html'),
              Path('blanchiment-dentaire-tanger/index.html'),
              Path('blog/blanchiment-dentaire-guide/index.html'),
          ]
          for p in files:
              text = p.read_text(encoding='utf-8')
              for raw in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, flags=re.S):
                  json.loads(raw)
          ET.parse('sitemap.xml')
          article = files[0].read_text(encoding='utf-8')
          assert article.count('<h1>') == 1
          assert article.count('class="geo-table"') >= 3
          assert 'site-faq' in article
          print('Validation OK')
          PY

      - name: Commit publication updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html blanchiment-dentaire-tanger/index.html blog/blanchiment-dentaire-guide/index.html sitemap.xml
          git rm .github/publish_wedding_article_once.py .github/workflows/publish-wedding-article-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate pre-wedding whitening article into SEO cluster"
            git push
          fi
