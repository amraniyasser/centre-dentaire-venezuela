name: Enforce canonical footer

on:
  push:
    paths:
      - '**/*.html'
      - '.github/scripts/standardize_footer.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical footer to every HTML page
        run: python3 .github/scripts/standardize_footer.py
      - name: Commit footer normalization when needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep canonical footer consistent site-wide' || exit 0
          git push
