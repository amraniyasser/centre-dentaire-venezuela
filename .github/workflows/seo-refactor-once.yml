name: SEO refactor once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-refactor-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SEO content refactor
        run: python .github/seo_content_once.py

      - name: Apply SEO schema refactor
        run: python .github/seo_schema_once.py

      - name: Validate SEO output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET

          assert 'https://centredentairevenezuela.com/#website' in Path('index.html').read_text(encoding='utf-8')
          assert 'Nos traitements et spécialités dentaires à Tanger' in Path('nos-soins/index.html').read_text(encoding='utf-8')
          whitening = Path('blanchiment-dentaire-tanger/index.html').read_text(encoding='utf-8')
          assert 'faq-prix-blanchiment-title' not in whitening
          assert whitening.count('<span class="kicker">Questions fréquentes</span>') == 1
          comparison = Path('blog/flash-opalescence-philips-zoom-blanchiment/index.html').read_text(encoding='utf-8')
          assert '<h1>Philips Zoom, fläsh ou Opalescence : quelles différences ?</h1>' in comparison

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              for raw in re.findall(r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>', text, re.S):
                  json.loads(raw)

          ET.parse('sitemap.xml')
          PY

          if git diff --name-only | grep -q '^assets/images/'; then
            echo 'Unexpected image change detected' >&2
            exit 1
          fi

      - name: Commit SEO updates
        shell: bash
        run: |
          rm -f .github/seo_content_once.py .github/seo_schema_once.py .github/workflows/seo-refactor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Strengthen sitewide SEO architecture and schemas"
          git push origin HEAD:main
