name: Clean blog template debris
on:
  push:
    paths:
      - '.github/workflows/cleanup-blog-template-debris.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale shell CSS from blog articles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          articles = sorted(Path('blog').glob('*/index.html'))
          if not articles:
              raise RuntimeError('No blog articles found')
          patterns = [
              r'\.top\{[^{}]*\}', r'\.top \.wide\{[^{}]*\}',
              r'\.brand\{[^{}]*\}', r'\.brand small\{[^{}]*\}', r'\.brand b\{[^{}]*\}',
              r'\.nav\{[^{}]*\}', r'\.nav \.cta\{[^{}]*\}',
              r'\.foot\{[^{}]*\}', r'\.foot \.wide\{[^{}]*\}', r'\.foot p,\.foot a\{[^{}]*\}',
          ]
          old_mobile = re.compile(r'@media\(max-width:700px\)\{\.top\{height:60px\}\.nav a:not\(\.cta\)\{display:none\}\.wide,\.top \.wide,\.foot \.wide\{width:min\(100% - 32px,1120px\)\}\.hero\{padding-top:40px\}\.article h2\{font-size:26px\}\.lead\{font-size:17px\}\.buttons\{flex-direction:column\}\.btn\{justify-content:center\}\.foot \.wide\{flex-direction:column\}\}')
          new_mobile = '@media(max-width:700px){.hero{padding-top:40px}.article h2{font-size:26px}.lead{font-size:17px}.buttons{flex-direction:column}.btn{justify-content:center}}'
          for p in articles:
              s = p.read_text(encoding='utf-8')
              for pat in patterns:
                  s = re.sub(pat, '', s)
              s = old_mobile.sub(new_mobile, s)
              p.write_text(s, encoding='utf-8')
          for p in articles:
              t = p.read_text(encoding='utf-8')
              assert '/* FAQ site-wide */' not in t, f'{p}: duplicated FAQ CSS'
              assert '.top{' not in t, f'{p}: stale .top CSS'
              assert '.foot{' not in t, f'{p}: stale .foot CSS'
              assert '.nav .cta{' not in t, f'{p}: stale old nav CTA CSS'
              assert t.count('class="site-faq"') == 1, f'{p}: FAQ count'
              assert t.count('class="callout blog-summary"') == 1, f'{p}: summary count'
              assert '/assets/css/site-shell.css' in t, f'{p}: shared shell missing'
              assert '/assets/js/site-shell.js' in t, f'{p}: shared shell JS missing'
          print('Blog article debris audit passed for', len(articles), 'articles')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/cleanup-blog-template-debris.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog
          git commit -m 'Remove stale blog template CSS'
          git push
