name: Add orthodontics service

on:
  push:
    paths:
      - '.github/scripts/add_orthodontie.py'
      - '.github/workflows/apply-orthodontie.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_orthodontie.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add orthodontics service" || exit 0
          git push
