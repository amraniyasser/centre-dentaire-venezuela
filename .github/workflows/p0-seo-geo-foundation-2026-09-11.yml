ellectuelle. Toute réutilisation substantielle doit faire l’objet d’une autorisation préalable du titulaire des droits concerné.</p><h2>Contact</h2><p>Pour toute question relative au site, vous pouvez écrire à <a href="mailto:centredentairevenezuela@gmail.com">centredentairevenezuela@gmail.com</a>.</p></main><footer class="foot"><span>© 2026 Centre Dentaire Venezuela · Tanger · </span><a href="/politique-confidentialite/">Politique de confidentialité</a></footer></body></html>'''
