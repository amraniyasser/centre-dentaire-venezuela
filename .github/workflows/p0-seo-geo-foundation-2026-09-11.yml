          def update_jsonld(text, path):
              pat = re.compile(r'<script\s+type=["\']application/ld\+json["\']>(.*?)</script>', re.S|re.I)
              def repl(m):
                  raw = m.group(1).strip()
                  try:
                      data = json.loads(raw)
                  except Exception:
                      return m.group(0)
                  graph = data.get('@graph') if isinstance(data, dict) else None
                  nodes = graph if isinstance(graph, list) else ([data] if isinstance(data, dict) else [])
                  def walk(obj):
                      if isinstance(obj, dict):
                          t = obj.get('@type')
                          if t == 'Dentist' or (isinstance(t, list) and 'Dentist' in t):
                              if obj.get('@id') == CLINIC_ID or obj.get('name') == 'Centre Dentaire Venezuela':
                                  obj['@id'] = CLINIC_ID
                                  obj['hasMap'] = MAPS
                                  obj['employee'] = {'@id': PERSON_ID}
                                  obj['sameAs'] = [INSTAGRAM, MAPS]
                          if t == 'Person' and obj.get('name') == 'Dr Majda Laasraoui':
                              obj['@id'] = PERSON_ID
                              obj['url'] = DOMAIN + '/dr-majda-laasraoui-dentiste-tanger/'
                              obj['jobTitle'] = 'Chirurgienne-dentiste'
                              obj['worksFor'] = {'@id': CLINIC_ID}
                              obj['knowsLanguage'] = ['fr','ar','en','es']
                          if t == 'Service':
                              obj.setdefault('provider', {'@id': CLINIC_ID})
                              obj.setdefault('areaServed', {'@type':'City','name':'Tanger'})
                          if t == 'Article' and path.endswith('blog/blanchiment-dentaire-guide/index.html'):
                              obj['dateModified'] = TODAY
                              obj['author'] = {'@id': PERSON_ID}
                              obj['reviewedBy'] = {'@id': PERSON_ID}
                              obj['publisher'] = {'@id': CLINIC_ID}
                          if t == 'ListItem' and obj.get('item') == DOMAIN + '/#soins':
                              obj['item'] = DOMAIN + '/nos-soins/'
                          for v in list(obj.values()): walk(v)
                      elif isinstance(obj, list):
                          for v in obj: walk(v)
                  walk(data)
                  if path.endswith('dr-majda-laasraoui-dentiste-tanger/index.html') and isinstance(data, dict):
                      g = data.setdefault('@graph', [])
                      if not any(isinstance(n,dict) and n.get('@type') == 'ProfilePage' for n in g):
                          g.insert(0, {'@type':'ProfilePage','@id':DOMAIN+'/dr-majda-laasraoui-dentiste-tanger/#webpage','url':DOMAIN+'/dr-majda-laasraoui-dentiste-tanger/','name':'Dr Majda Laasraoui, chirurgienne-dentiste à Tanger','mainEntity':{'@id':PERSON_ID},'inLanguage':'fr-MA','isPartOf':{'@id':DOMAIN+'/#website'}})
                  if path.endswith('blog/blanchiment-dentaire-guide/index.html') and isinstance(data, dict):
                      g = data.setdefault('@graph', [])
                      if not any(isinstance(n,dict) and n.get('@id') == PERSON_ID for n in g):
                          g.append({'@type':'Person','@id':PERSON_ID,'name':'Dr Majda Laasraoui','jobTitle':'Chirurgienne-dentiste','url':DOMAIN+'/dr-majda-laasraoui-dentiste-tanger/','worksFor':{'@id':CLINIC_ID},'knowsLanguage':['fr','ar','en','es']})
                      if not any(isinstance(n,dict) and n.get('@id') == CLINIC_ID for n in g):
                          g.append({'@type':'Dentist','@id':CLINIC_ID,'name':'Centre Dentaire Venezuela','url':DOMAIN+'/','telephone':'+212531112127','address':{'@type':'PostalAddress','streetAddress':'4ème étage n°74, Immeuble Venezuela, 89 Rue Moussa Ben Noussair','postalCode':'90000','addressLocality':'Tanger','addressCountry':'MA'},'geo':{'@type':'GeoCoordinates','latitude':35.7781833,'longitude':-5.8165155},'hasMap':MAPS,'employee':{'@id':PERSON_ID},'sameAs':[INSTAGRAM,MAPS]})
                  return '<script type="application/ld+json">'+json.dumps(data, ensure_ascii=False, separators=(',',':'))+'</script>'
              return pat.sub(repl, text)

          def add_legal_links(text):
              if '/mentions-legales/' in text and '/politique-confidentialite/' in text:
                  return text
              block = '<div class="site-legal-links" style="padding:12px 20px 18px;text-align:center;font-size:11px;opacity:.72"><a href="/mentions-legales/">Mentions légales</a> · <a href="/politique-confidentialite/">Politique de confidentialité</a></div>'
              if '</footer>' in text:
                  return text.replace('</footer>', block+'</footer>', 1)
              return text

          htmls = list(ROOT.rglob('*.html'))
          for p in htmls:
              rel = p.as_posix()
              if rel in ('mentions-legales/index.html','politique-confidentialite/index.html','nos-soins/index.html'):
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<link\s+rel=["\'](?:icon|shortcut icon)["\'][^>]*>\s*', '', s, flags=re.I)
              fav = '<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">\n<link rel="alternate icon" href="/assets/images/logo-centre-dentaire-venezuela.webp" type="image/webp">\n<meta name="theme-color" content="#143b3e">\n'
              m = re.search(r'(<meta\s+name=["\']viewport["\'][^>]*>\s*)', s, re.I)
              if m and '/favicon.svg' not in s:
                  s = s[:m.end()] + fav + s[m.end():]
              s = s.replace('https://share.google/NQdfjEYv9MC4431Lz', MAPS)
              s = s.replace('href="/#soins"', 'href="/nos-soins/"').replace("href='/#soins'", "href='/nos-soins/'")
              s = s.replace(DOMAIN + '/#soins', DOMAIN + '/nos-soins/')
              if rel.endswith('blog/blanchiment-dentaire-guide/index.html'):
                  s = s.replace('9 septembre 2026 · Données scientifiques mises à jour en septembre 2026', 'Publié le 9 septembre 2026 · Mis à jour le 11 septembre 2026')
                  if 'Relecture médicale :' not in s:
                      s = s.replace('</div><p class="lead">Le blanchiment dentaire', '</div><p class="evidence" style="margin-top:10px!important">Relecture médicale : <a href="/dr-majda-laasraoui-dentiste-tanger/">Dr Majda Laasraoui, chirurgienne-dentiste à Tanger</a>.</p><p class="lead">Le blanchiment dentaire', 1)
              s = update_jsonld(s, rel)
              s = add_legal_links(s)
              p.write_text(s, encoding='utf-8')

          sitemap_urls = [
              '/', '/dr-majda-laasraoui-dentiste-tanger/', '/nos-soins/', '/soins-dentaires-tanger/',
              '/chirurgie-dentaire-tanger/', '/dentisterie-esthetique-tanger/', '/blanchiment-dentaire-tanger/',
              '/endodontie-tanger/', '/parodontologie-tanger/', '/orthodontie-tanger/', '/implant-dentaire-tanger/',
              '/blog/', '/blog/blanchiment-dentaire-guide/'
          ]
          sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          for u in sitemap_urls:
              sitemap += f'  <url><loc>{DOMAIN}{u}</loc><lastmod>{TODAY}</lastmod></url>\n'
          sitemap += '</urlset>\n'
          Path('sitemap.xml').write_text(sitemap, encoding='utf-8')

          audit = '''# Audit performance — 11 septembre 2026\n\n## État observé\n- Hero vidéo longue : environ 2,5 Mo.\n- Variante hero courte : environ 1,0 Mo.\n- Vidéo de présentation du cabinet : environ 3,4 Mo.\n- Carte Google Maps chargée en lazy loading.\n- Images principales en WebP.\n\n## Décision P0\nAucune dégradation visuelle n'est introduite sans mesure réelle. Le point principal à surveiller est le LCP mobile de la homepage à cause de la vidéo hero. Mesurer PageSpeed / Core Web Vitals avant de remplacer la vidéo longue par la version courte.\n\n## Règle\nToute nouvelle image doit être dimensionnée, compressée et servie dans un format moderne. Toute nouvelle vidéo doit être compressée et ne doit pas bloquer le rendu initial.\n'''
          Path('.github/project-docs/performance-audit-2026-09-11.md').write_text(audit, encoding='utf-8')

          # Validations
          indexables = [Path(u.strip('/'))/'index.html' if u != '/' else Path('index.html') for u in sitemap_urls]
          for p in indexables:
              assert p.exists(), p
              s = p.read_text(encoding='utf-8')
              assert 'rel="canonical"' in s, p
              assert '<h1' in s.lower(), p
              assert '/favicon.svg' in s, p
          assert PERSON_ID in Path('dr-majda-laasraoui-dentiste-tanger/index.html').read_text(encoding='utf-8')
          assert 'ProfilePage' in Path('dr-majda-laasraoui-dentiste-tanger/index.html').read_text(encoding='utf-8')
          assert 'Mis à jour le 11 septembre 2026' in Path('blog/blanchiment-dentaire-guide/index.html').read_text(encoding='utf-8')
          assert '/nos-soins/' in Path('sitemap.xml').read_text(encoding='utf-8')
          PY
