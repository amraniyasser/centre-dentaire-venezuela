name: Replace experience with multilingual

on:
  push:
    paths:
      - '.github/scripts/replace_experience_multilingual.py'
      - '.github/workflows/apply-multilingual-hero.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/replace_experience_multilingual.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace experience stat with multilingual info" || exit 0
          git push
