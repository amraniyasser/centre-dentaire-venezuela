name: Refine whitening brands article
on:
  push:
    paths:
      - '.github/workflows/refine-whitening-brands-article.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official visuals and rewrite article
        run: |
          python3 -m pip install --quiet requests pillow pypdfium2
          python3 - <<'PY'
          from pathlib import Path
          import io, re, requests
          from PIL import Image
          import pypdfium2 as pdfium

          OUT = Path('assets/images/blog')
          OUT.mkdir(parents=True, exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0'}

          def save_webp_from_bytes(data, path, max_size=(1200,800), quality=78):
              im=Image.open(io.BytesIO(data)).convert('RGB')
              im.thumbnail(max_size, Image.Resampling.LANCZOS)
              im.save(path, 'WEBP', quality=quality, method=6)

          # fläsh: official French catalogue hosted on flaesh.com; page 4 contains the Chairside system visual.
          pdf_url='https://flaesh.com/wp-content/uploads/2025/03/902A4-flaesh-catalogue-french.pdf'
          pdf_data=requests.get(pdf_url,headers=headers,timeout=30).content
          doc=pdfium.PdfDocument(pdf_data)
          page=doc[3]
          bitmap=page.render(scale=1.6)
          pil=bitmap.to_pil().convert('RGB')
          pil.thumbnail((1200,1000), Image.Resampling.LANCZOS)
          pil.save(OUT/'flaesh-chairside-officiel.webp','WEBP',quality=76,method=6)

          # Opalescence: official product image referenced by opalescence.fr.
          opa_url='https://images.ctfassets.net/951j4zzzl64c/4UV4dcLMQVyPhBXa64TmpB/dc98be1ffcd3f68754b692955a5c9855/eu_opalescence-pf_kit_4up_blueinfront_3d.png'
          r=requests.get(opa_url,headers=headers,timeout=30); r.raise_for_status()
          save_webp_from_bytes(r.content, OUT/'opalescence-pf-officiel.webp')

          # Philips: official Philips product visual.
          philips_url='https://images.philips.com/is/image/philipsconsumer/b033512161f641b5988bb1d400c93473?$png$=&hei=720&wid=720'
          r=requests.get(philips_url,headers=headers,timeout=30); r.raise_for_status()
          save_webp_from_bytes(r.content, OUT/'philips-zoom-whitespeed-officiel.webp')

          p=Path('blog/flash-opalescence-philips-zoom-blanchiment/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<title>fläsh, Opalescence ou Philips Zoom : quel blanchiment ? | Tanger</title>', '<title>Blanchiment Zoom, fläsh ou Opalescence à Tanger : comparatif</title>')
          s=re.sub(r'<meta name="description" content="[^"]+">', '<meta name="description" content="Blanchiment dentaire Zoom, fläsh ou Opalescence à Tanger : différences, protocoles, lampe LED, gouttières et sensibilité, selon les sites officiels.">', s, count=1)
          s=s.replace('<meta property="og:title" content="fläsh, Opalescence ou Philips Zoom : quelles différences ?">', '<meta property="og:title" content="Blanchiment Zoom, fläsh ou Opalescence à Tanger : quelles différences ?">')
          s=s.replace('<meta property="og:description" content="Comparatif des principaux systèmes de blanchiment professionnel avec sources officielles.">', '<meta property="og:description" content="Comparatif documenté des systèmes fläsh, Opalescence et Philips Zoom, avec sources officielles et repères pour un blanchiment dentaire à Tanger.">')
          s=re.sub(r'<meta property="og:image" content="[^"]+">', '<meta property="og:image" content="https://centredentairevenezuela.com/assets/images/blog/philips-zoom-whitespeed-officiel.webp">', s, count=1)
          s=s.replace('<h1>fläsh, Opalescence ou Philips Zoom : quelles différences pour un blanchiment dentaire ?</h1>', '<h1>Blanchiment Zoom, fläsh ou Opalescence à Tanger : quelles différences ?</h1>')
          s=re.sub(r'<p class="lead">.*?</p>', '<p class="lead">Vous recherchez un <strong>blanchiment dentaire Zoom à Tanger</strong>, un <strong>blanchiment fläsh à Tanger</strong> ou un protocole <strong>Opalescence à Tanger</strong> ? Ces marques ne correspondent pas au même type de traitement. Ce guide compare leurs protocoles à partir des sites officiels fläsh, Opalescence et Philips, puis explique les points à vérifier avec votre dentiste avant de choisir.</p>', s, count=1, flags=re.S)

          flash_block='''<h2>1. Blanchiment fläsh à Tanger : que dit le fabricant ?</h2><p>Le site officiel <strong>fläsh</strong> présente le <strong>Chairside Light Whitening System</strong> comme un protocole réalisé au cabinet dentaire. Le fabricant indique 3 à 4 applications de 15 minutes lors d’une même séance. Deux concentrations sont présentées selon l’indication et la réglementation applicable : 6 % de peroxyde d’hydrogène pour l’éclaircissement esthétique et 32 % pour l’éclaircissement médical sur indication médicale.</p><p>Le système est conçu pour être utilisé avec la <strong>fläsh Whitening Lamp</strong>. La page officielle de la lampe décrit trois LED haute performance, un spectre de lumière bleue à 460 nm, une intensité annoncée de 190 mW/cm², ainsi que des réglages pour les dents sensibles et l’éclaircissement d’une dent unique.</p><figure><img src="/assets/images/blog/flaesh-chairside-officiel.webp" loading="lazy" width="1200" height="900" alt="fläsh Chairside Light Whitening System - documentation officielle du blanchiment fläsh"><figcaption>Visuel extrait du catalogue officiel français fläsh. <a href="https://flaesh.com/fr/chairside-light-whitening-system/" target="_blank" rel="noopener noreferrer">Voir le système Chairside officiel</a> · <a href="https://flaesh.com/fr/whitening-lamp/" target="_blank" rel="noopener noreferrer">Voir la lampe fläsh officielle</a>.</figcaption></figure><p class="evidence">Sources fabricant : <a href="https://flaesh.com/fr/chairside-light-whitening-system/" target="_blank" rel="noopener noreferrer">fläsh Chairside Light Whitening System</a> et <a href="https://flaesh.com/fr/whitening-lamp/" target="_blank" rel="noopener noreferrer">fläsh Whitening Lamp</a>.</p>'''
          s=re.sub(r'<h2>1\. fläsh / WHITEsmile</h2>.*?(?=<h2>2\.)', flash_block, s, count=1, flags=re.S)

          opa_block='''<h2>2. Blanchiment Opalescence à Tanger : gouttières professionnelles supervisées</h2><p>Le site français officiel <strong>Opalescence</strong> insiste sur un point important : ses produits d’éclaircissement sont disponibles par l’intermédiaire des cabinets dentaires. Sur le site français, la gamme mise en avant comprend notamment <strong>Opalescence PF</strong>, avec gouttières sur mesure, et <strong>Opalescence Go</strong>, avec gouttières préremplies.</p><p>Opalescence PF est présenté en concentrations de 10 % et 16 % de peroxyde de carbamide, avec un port pouvant aller de 4 à 6 heures par jour ou jusqu’à une nuit entière selon la concentration et les instructions du dentiste. Opalescence Go est présenté en 6 % de peroxyde d’hydrogène, avec un temps de port annoncé de 60 à 90 minutes par jour. Le fabricant indique également la présence de nitrate de potassium et de fluor dans ces gels pour le confort du patient.</p><figure><img src="/assets/images/blog/opalescence-pf-officiel.webp" loading="lazy" width="1200" height="800" alt="Opalescence PF - gouttières et gel de blanchiment dentaire professionnel"><figcaption>Visuel produit officiel Opalescence PF. <a href="https://www.opalescence.fr/products/opalescence-pf" target="_blank" rel="noopener noreferrer">Source officielle Opalescence France</a>.</figcaption></figure><p class="evidence">Sources fabricant : <a href="https://www.opalescence.fr/products/opalescence-pf" target="_blank" rel="noopener noreferrer">Opalescence PF</a>, <a href="https://www.opalescence.fr/products/opalescence-go" target="_blank" rel="noopener noreferrer">Opalescence Go</a> et <a href="https://www.opalescence.fr/products/compare" target="_blank" rel="noopener noreferrer">comparateur officiel Opalescence</a>.</p>'''
          s=re.sub(r'<h2>2\. Opalescence Pro</h2>.*?(?=<h2>3\.)', opa_block, s, count=1, flags=re.S)

          zoom_block='''<h2>3. Blanchiment dentaire Philips Zoom WhiteSpeed à Tanger</h2><p><strong>Philips Zoom WhiteSpeed</strong> est présenté par Philips comme un système d’éclaircissement réalisé au cabinet dentaire avec activation par lumière LED. La fiche officielle belge décrit un traitement en quatre séquences de 15 minutes, tandis que la page professionnelle Philips présente un protocole pouvant éclaircir jusqu’à huit teintes en 45 minutes dans les conditions de l’étude citée par le fabricant.</p><p>Philips indique également que l’intensité lumineuse peut être réglée et que le traitement doit être recommandé et administré par un professionnel de santé bucco-dentaire. Les résultats annoncés par la marque ne constituent pas une garantie individuelle : la teinte initiale, la cause des colorations, les restaurations existantes et la sensibilité peuvent modifier le résultat.</p><figure><img src="/assets/images/blog/philips-zoom-whitespeed-officiel.webp" loading="lazy" width="720" height="720" alt="Philips Zoom WhiteSpeed - système officiel de blanchiment dentaire au cabinet"><figcaption>Visuel officiel Philips Zoom WhiteSpeed. <a href="https://www.philips.be/fr/c-p/DIS577_01/zoom-whitespeed-blanchiment-des-dents-chez-le-dentiste" target="_blank" rel="noopener noreferrer">Source officielle Philips Belgique</a>.</figcaption></figure><p class="evidence">Sources fabricant : <a href="https://www.philips.be/fr/c-p/DIS577_01/zoom-whitespeed-blanchiment-des-dents-chez-le-dentiste" target="_blank" rel="noopener noreferrer">Philips Zoom WhiteSpeed</a> et <a href="https://www.philips.be/fr/c-m-pe/professionnels-dentaires/sonicare-professionnels/blanchiment-des-dents-professionnel/blanchiment-dentaire-en-cabinet/eclaircissement-professionnel-des-dents-zoom-whitespeed" target="_blank" rel="noopener noreferrer">page professionnelle Philips</a>.</p>'''
          s=re.sub(r'<h2>3\. Philips Zoom WhiteSpeed</h2>.*?(?=<h2>Comparatif rapide</h2>)', zoom_block, s, count=1, flags=re.S)

          new_table='''<h2>Comparatif rapide : fläsh, Opalescence et Philips Zoom</h2><table class="compare"><thead><tr><th>Système</th><th>Type de protocole officiel</th><th>Repères du fabricant</th></tr></thead><tbody><tr><td>fläsh Chairside Light Whitening</td><td>Au cabinet + lampe LED fläsh</td><td>3 à 4 applications de 15 min ; 6 % HP esthétique / 32 % HP sur indication médicale</td></tr><tr><td>Opalescence PF / Go</td><td>Gouttières professionnelles supervisées</td><td>PF : 10/16 % CP ; Go : 6 % HP ; temps de port selon protocole</td></tr><tr><td>Philips Zoom WhiteSpeed</td><td>Au cabinet + LED</td><td>4 × 15 min sur la fiche belge ; résultats variables selon le patient</td></tr></tbody></table>'''
          s=re.sub(r'<h2>Comparatif rapide</h2><table class="compare">.*?</table>', new_table, s, count=1, flags=re.S)

          local_block='''<h2>Blanchiment Zoom, fläsh ou Opalescence à Tanger : comment choisir ?</h2><p>À Tanger, une recherche comme <strong>“blanchiment dentaire Zoom Tanger”</strong>, <strong>“blanchiment fläsh Tanger”</strong> ou <strong>“Opalescence Tanger”</strong> peut donner l’impression que le choix se résume à une marque. En pratique, la première étape reste le bilan : origine de la coloration, état des gencives, caries éventuelles, sensibilité, présence de couronnes, facettes ou composites, et objectif de teinte.</p><p>Le <a href="/blanchiment-dentaire-tanger/"><strong>blanchiment dentaire à Tanger</strong></a> doit donc être choisi en fonction du diagnostic et du protocole adapté, pas uniquement parce qu’une marque utilise une lampe ou affiche une concentration plus élevée. Pour les patients qui souhaitent être examinés au Centre Dentaire Venezuela, <a href="/dr-majda-laasraoui-dentiste-tanger/"><strong>Dr Majda Laasraoui, chirurgienne-dentiste à Tanger</strong></a>, peut évaluer la situation clinique et expliquer les options pertinentes. La disponibilité d’une marque précise au cabinet doit être confirmée au moment de la prise de rendez-vous.</p>'''
          if 'Blanchiment Zoom, fläsh ou Opalescence à Tanger : comment choisir ?' not in s:
              s=s.replace('<h2>Avec ou sans lampe : est-ce vraiment le critère décisif ?</h2>', local_block+'<h2>Avec ou sans lampe : est-ce vraiment le critère décisif ?</h2>')

          # Replace obsolete source references and align schema with the official French/Belgian pages requested.
          s=s.replace('https://www.whitesmile.com/company/','https://flaesh.com/fr/')
          s=s.replace('https://www.whitesmile.com/power-whitening/','https://flaesh.com/fr/chairside-light-whitening-system/')
          s=s.replace('https://www.whitesmile.com/light-whitening/','https://flaesh.com/fr/whitening-lamp/')
          s=s.replace('https://www.ultradent.com/products/categories/whitening/in-office/opalescence-pro','https://www.opalescence.fr/products/opalescence-pf')
          s=s.replace('https://www.usa.philips.com/professionals/dental/whitening/in-office-whitening','https://www.philips.be/fr/c-p/DIS577_01/zoom-whitespeed-blanchiment-des-dents-chez-le-dentiste')

          # Strengthen Article entities for GEO without claiming the clinic offers any specific brand.
          s=s.replace('"description":"Comparatif documenté des systèmes de blanchiment professionnel fläsh/WHITEsmile, Opalescence Pro et Philips Zoom WhiteSpeed."', '"description":"Comparatif documenté du blanchiment dentaire fläsh, Opalescence et Philips Zoom WhiteSpeed, avec sources officielles et repères pour les patients à Tanger."')
          s=s.replace('"headline":"fläsh, Opalescence ou Philips Zoom : quelles différences pour un blanchiment dentaire ?"', '"headline":"Blanchiment Zoom, fläsh ou Opalescence à Tanger : quelles différences ?"')

          p.write_text(s,encoding='utf-8')

          # Blog card: make the search intent explicit without keyword stuffing.
          bp=Path('blog/index.html')
          b=bp.read_text(encoding='utf-8')
          b=b.replace('fläsh, Opalescence ou Philips Zoom : quelles différences ?', 'Blanchiment Zoom, fläsh ou Opalescence : quelles différences ?')
          b=b.replace('Comparatif des systèmes fläsh, Opalescence et Philips Zoom', 'Blanchiment Zoom, fläsh et Opalescence à Tanger : comparatif')
          bp.write_text(b,encoding='utf-8')

          # Safety checks.
          assert 'https://flaesh.com/fr/chairside-light-whitening-system/' in s
          assert 'https://www.opalescence.fr/products/opalescence-pf' in s
          assert 'https://www.philips.be/fr/c-p/DIS577_01/zoom-whitespeed-blanchiment-des-dents-chez-le-dentiste' in s
          assert '/assets/images/blog/flaesh-chairside-officiel.webp' in s
          assert '/assets/images/blog/opalescence-pf-officiel.webp' in s
          assert '/assets/images/blog/philips-zoom-whitespeed-officiel.webp' in s
          assert '/blanchiment-dentaire-tanger/' in s and '/dr-majda-laasraoui-dentiste-tanger/' in s
          PY
      - name: Commit article and official visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/ assets/images/blog/
          git commit -m 'Strengthen whitening brands article for Tanger SEO'
          git push
