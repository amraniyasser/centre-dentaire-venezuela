<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Repères d’études sur la durée du blanchiment dentaire</title><desc id="desc">Frise de suivi montrant qu’un éclaircissement peut rester observable à six mois, un an, deux ans et quatre ans et demi selon différents essais, avec une reprise progressive de la teinte.</desc><rect width="1400" height="800" rx="36" fill="#f4f8f7"/><text x="90" y="105" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="3" fill="#8fb5b1">REPÈRES ISSUS DES ÉTUDES</text><text x="90" y="165" font-family="Georgia,serif" font-size="48" fill="#143b3e">La couleur évolue progressivement</text><text x="90" y="214" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5d7d7c">Pas de date d’expiration unique : la teinte peut remonter tout en restant plus claire qu’au départ.</text><line x1="130" y1="430" x2="1270" y2="430" stroke="#8abdb8" stroke-width="8" stroke-linecap="round"/><g font-family="Arial,Helvetica,sans-serif"><circle cx="210" cy="430" r="30" fill="#143b3e"/><text x="210" y="438" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">0</text><text x="210" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#143b3e">Fin du traitement</text><text x="210" y="536" text-anchor="middle" font-size="18" fill="#5d7d7c">teinte obtenue</text><circle cx="470" cy="430" r="30" fill="#2f6d6b"/><text x="470" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6M</text><text x="470" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#143b3e">6 mois</text><text x="470" y="536" text-anchor="middle" font-size="18" fill="#5d7d7c">rebond possible</text><circle cx="730" cy="430" r="30" fill="#2f6d6b"/><text x="730" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1A</text><text x="730" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#143b3e">1 an</text><text x="730" y="536" text-anchor="middle" font-size="18" fill="#5d7d7c">effet encore observé</text><circle cx="990" cy="430" r="30" fill="#8abdb8"/><text x="990" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#143b3e">2A</text><text x="990" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#143b3e">2 ans</text><text x="990" y="536" text-anchor="middle" font-size="18" fill="#5d7d7c">suivis publiés</text><circle cx="1250" cy="430" r="30" fill="#e5bd8c"/><text x="1250" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#143b3e">4,5A</text><text x="1250" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#143b3e">4,5 ans</text><text x="1250" y="536" text-anchor="middle" font-size="18" fill="#5d7d7c">effet pertinent dans un RCT</text></g><rect x="90" y="625" width="1220" height="92" rx="18" fill="#ffffff" stroke="#d6e5e3"/><text x="120" y="666" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#143b3e">À retenir</text><text x="120" y="698" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5d7d7c">Ces points correspondent à des études différentes. Ils ne prédisent pas la durée exacte chez un patient donné.</text></svg>