name: Accent Tanger service titles 2026-09-09

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/accent-tanger-service-titles-2026-09-09.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Accent Tanger in service H1s
        run: python .github/scripts/accent_tanger_service_titles_2026_09_09.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soins-dentaires-tanger/index.html chirurgie-dentaire-tanger/index.html dentisterie-esthetique-tanger/index.html endodontie-tanger/index.html parodontologie-tanger/index.html orthodontie-tanger/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Accent Tanger in service page titles"
          git push
