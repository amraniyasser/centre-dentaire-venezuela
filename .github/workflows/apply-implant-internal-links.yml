name: Link implant service page

on:
  push:
    paths:
      - '.github/scripts/link_implant_page.py'
      - '.github/workflows/apply-implant-internal-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/link_implant_page.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link homepage to implant service page" || exit 0
          git push
