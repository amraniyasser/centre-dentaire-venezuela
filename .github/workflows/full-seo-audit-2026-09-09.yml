name: Full SEO audit 2026-09-09

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/full-seo-audit-2026-09-09.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full SEO audit
        id: audit
        continue-on-error: true
        run: python .github/scripts/full_seo_audit_2026_09_09.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/seo-audit-report.md
          git diff --cached --quiet || (git commit -m "Add full SEO audit report" && git push)
      - name: Fail if audit found errors
        if: steps.audit.outcome == 'failure'
        run: exit 1
