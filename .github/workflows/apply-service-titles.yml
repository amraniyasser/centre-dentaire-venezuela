name: Simplify service titles

on:
  push:
    paths:
      - '.github/scripts/simplify_service_titles.py'
      - '.github/workflows/apply-service-titles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/simplify_service_titles.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify homepage service titles" || exit 0
          git push
