name: Harmonize homepage services 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/harmonize-home-services-2026-09-11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harmonize homepage services with hub
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Main and mobile nav: point "Nos soins" to the real hub page.
          s = s.replace('<a href="#soins">Nos soins</a>', '<a href="/nos-soins/">Nos soins</a>')

          # Section CTA: the cards still link to their dedicated treatment pages,
          # while this CTA exposes the complete hub for users and crawlers.
          s = s.replace('<a class="btn-dark" href="#rdv">Prendre rendez-vous</a>', '<a class="btn-dark" href="/nos-soins/">Voir tous nos soins</a>', 1)

          # Add whitening as its own 8th high-intent service card.
          if 'href="/blanchiment-dentaire-tanger/" aria-label="Découvrir notre page Blanchiment dentaire à Tanger"' not in s:
              marker = '''          <article class="soin-card">\n            <span class="soin-num">07</span>'''
              pos = s.find(marker)
              if pos == -1:
                  raise SystemExit('Orthodontie card marker not found')
              # Find the end of card 07.
              end = s.find('          </article>', pos)
              if end == -1:
                  raise SystemExit('Orthodontie card end not found')
              end += len('          </article>')
              whitening = '''\n          <article class="soin-card">\n            <span class="soin-num">08</span>\n            <span class="soin-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5c1.4-.9 3-1.3 5-1.3s3.6.4 5 1.3"/><path d="M6 8.5c1.7.8 3.7 1.2 6 1.2s4.3-.4 6-1.2"/><path d="M8.2 12.3c.5 4.7 1.7 7.2 3.8 7.2s3.3-2.5 3.8-7.2"/><path d="m17.8 4.1.7 1.5 1.5.7-1.5.7-.7 1.5-.7-1.5-1.5-.7 1.5-.7z"/></svg></span>\n            <h3>Blanchiment dentaire</h3>\n            <p>Éclaircissement professionnel des dents naturelles après bilan, avec protocole adapté à la teinte et à la sensibilité.</p>\n            <a class="soin-more" href="/blanchiment-dentaire-tanger/" aria-label="Découvrir notre page Blanchiment dentaire à Tanger">Découvrir le traitement <span aria-hidden="true">→</span></a>\n          </article>'''
              s = s[:end] + whitening + s[end:]

          # With 8 cards, use a clean 4 + 4 grid instead of the old 4 + 3 layout.
          s = s.replace('/* Quatre cartes sur la première rangée, trois cartes plus larges en dessous. */\n.soin-card:nth-child(n+5){grid-column:span 4}', '/* Huit cartes : quatre colonnes sur deux rangées régulières. */')
          s = s.replace('  .soin-card,\n  .soin-card:nth-child(n+5){grid-column:span 6}\n  .soin-card:nth-child(7){grid-column:4 / span 6}', '  .soin-card{grid-column:span 6}')
          s = s.replace('  .soin-card,\n  .soin-card:nth-child(n+5),\n  .soin-card:nth-child(7){', '  .soin-card{')

          # Add whitening to footer service navigation if missing.
          footer_anchor = '<a href="/dentisterie-esthetique-tanger/">Dentisterie esthétique</a>'
          footer_whitening = footer_anchor + '\n          <a href="/blanchiment-dentaire-tanger/">Blanchiment dentaire</a>'
          if '<a href="/blanchiment-dentaire-tanger/">Blanchiment dentaire</a>' not in s:
              s = s.replace(footer_anchor, footer_whitening, 1)

          # Add whitening as a distinct service in the homepage OfferCatalog.
          if '"name":"Blanchiment dentaire professionnel"' not in s:
              aesthetic = '{"@type":"Offer","itemOffered":{"@type":"Service","name":"Dentisterie esthétique : blanchiment et facettes","url":"https://centredentairevenezuela.com/dentisterie-esthetique-tanger/","provider":{"@id":"https://centredentairevenezuela.com/#dentist"},"areaServed":{"@type":"City","name":"Tanger"}}}'
              whitening_offer = aesthetic + ',{"@type":"Offer","itemOffered":{"@type":"Service","name":"Blanchiment dentaire professionnel","url":"https://centredentairevenezuela.com/blanchiment-dentaire-tanger/","provider":{"@id":"https://centredentairevenezuela.com/#dentist"},"areaServed":{"@type":"City","name":"Tanger"}}}'
              if aesthetic in s:
                  s = s.replace(aesthetic, whitening_offer, 1)
              else:
                  raise SystemExit('Aesthetic offer not found')

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harmonize homepage with eight-service hub' || exit 0
          git push
