name: Fix service title lengths

on:
  push:
    paths:
      - '.github/scripts/fix_long_service_titles.py'
      - '.github/workflows/fix-service-title-lengths.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_long_service_titles.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add endodontie-tanger/index.html orthodontie-tanger/index.html parodontologie-tanger/index.html
          git commit -m "Keep service title tags under 65 characters" || exit 0
          git push
