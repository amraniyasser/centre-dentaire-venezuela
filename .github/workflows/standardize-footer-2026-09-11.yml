name: Standardize compact footer

on:
  push:
    paths:
      - '.github/workflows/standardize-footer-2026-09-11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical footer
        run: python3 .github/scripts/standardize_footer.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Standardize compact footer site-wide with WhatsApp' || exit 0
          git push
