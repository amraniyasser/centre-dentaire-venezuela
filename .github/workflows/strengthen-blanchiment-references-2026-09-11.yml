name: Strengthen whitening SEO and medical references 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/strengthen-blanchiment-references-2026-09-11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply content improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')

          # 1) Commercial whitening page: capture high-intent Google questions without inventing clinic prices.
          p = Path('blanchiment-dentaire-tanger/index.html')
          s = read(p)
          if 'Questions sur le prix et les méthodes de blanchiment' not in s:
              block = '''\n<section class="section" aria-labelledby="faq-prix-blanchiment-title">\n  <div class="inner faq">\n    <div class="section-head">\n      <span class="kicker">Prix, méthodes et durée</span>\n      <h2 id="faq-prix-blanchiment-title">Questions sur le prix et les méthodes de blanchiment</h2>\n      <p class="lead">Les tarifs vus en ligne au Maroc peuvent varier fortement parce qu'ils ne couvrent pas toujours le même protocole. Au Centre Dentaire Venezuela, le montant est confirmé après le bilan afin de tenir compte de la technique retenue, d'un éventuel soin préalable et du suivi nécessaire.</p>\n    </div>\n    <details><summary>Quel est le tarif d'un blanchiment dentaire au Maroc ?</summary><p>Il n'existe pas un tarif unique national. Le prix dépend notamment de la méthode utilisée, du nombre de séances, de la situation dentaire initiale et de ce qui est inclus dans le protocole. Pour comparer deux offres, il est plus utile de vérifier le bilan préalable, la protection des gencives, le produit utilisé, le suivi et les éventuels soins nécessaires avant le blanchiment. Le cabinet établit un devis adapté après examen.</p></details>\n    <details><summary>Quel est le prix d'un blanchiment dentaire à Tanger ?</summary><p>Les prix publiés à Tanger varient d'un cabinet à l'autre et ne correspondent pas toujours au même traitement. Nous ne publions pas de prix standard sans examen, car une séance au fauteuil, des gouttières personnalisées ou une approche combinée ne répondent pas aux mêmes indications. Vous pouvez demander un rendez-vous afin d'obtenir un devis correspondant à votre situation.</p></details>\n    <details><summary>Quel est le prix d'une gouttière de blanchiment ?</summary><p>Le coût dépend de la fabrication sur mesure, du gel prescrit, de la durée prévue et du suivi. Une gouttière professionnelle ne se compare donc pas directement à une gouttière universelle ou à un kit vendu sans bilan dentaire.</p></details>\n    <details><summary>Qu'est-ce qu'un blanchiment dentaire « flash » ?</summary><p>Le terme « flash » est surtout utilisé comme terme commercial pour désigner un protocole court au fauteuil. Une séance plus courte ou une lampe plus puissante ne garantit pas à elle seule un meilleur résultat final. Le choix du protocole doit surtout dépendre du diagnostic, du produit et de la sensibilité du patient.</p></details>\n    <details><summary>Quelle est la durée d'un blanchiment dentaire ?</summary><p>La durée du rendez-vous et la durée globale du traitement dépendent de la méthode retenue. Certaines prises en charge se font principalement au cabinet, d'autres utilisent des gouttières à domicile pendant plusieurs jours. La stabilité de la teinte dans le temps dépend aussi des habitudes alimentaires, du tabac, de l'hygiène et de la teinte initiale.</p></details>\n    <details><summary>Quels sont les inconvénients d'un blanchiment dentaire ?</summary><p>Le principal effet indésirable est une sensibilité dentaire transitoire. Une irritation des gencives peut également survenir si le produit entre en contact avec les tissus mous. Le blanchiment ne modifie pas la couleur des couronnes, facettes ou composites, ce qui doit être anticipé avant le traitement.</p></details>\n    <details><summary>Comment blanchir des dents jaunes ?</summary><p>La première étape est de déterminer pourquoi les dents paraissent jaunes : dépôts et colorations externes, teinte naturelle, vieillissement, restaurations ou autre cause. Un détartrage ou un polissage peut parfois suffire pour certaines taches externes ; dans d'autres cas, un blanchiment peut être discuté après examen.</p></details>\n    <details><summary>Quels produits de blanchiment dentaire existent ?</summary><p>Les protocoles professionnels reposent principalement sur des agents à base de peroxyde, avec des concentrations et des modes d'application différents selon qu'ils sont utilisés au fauteuil ou dans des gouttières supervisées. Les dentifrices dits blanchissants agissent surtout sur les colorations de surface et ne produisent pas le même effet qu'un éclaircissement chimique.</p></details>\n    <details><summary>Un « Hollywood Smile » est-il la même chose qu'un blanchiment ?</summary><p>Non. Un blanchiment vise à éclaircir la teinte des dents naturelles. L'expression « Hollywood Smile » peut désigner des traitements esthétiques beaucoup plus larges, parfois avec facettes ou restaurations. Le plan de traitement dépend donc de l'objectif recherché et de l'état des dents.</p></details>\n  </div>\n</section>\n'''
              s = s.replace('</main>', block + '\n</main>')

          if 'Références médicales récentes sur le blanchiment' not in s:
              refs = '''\n<section class="section alt" aria-labelledby="refs-blanchiment-title">\n  <div class="inner">\n    <div class="section-head"><span class="kicker">Sources</span><h2 id="refs-blanchiment-title">Références médicales récentes sur le blanchiment</h2><p class="lead">Sélection courte de publications récentes utilisées pour vérifier les informations générales de cette page.</p></div>\n    <ul class="sources">\n      <li><a href="https://pubmed.ncbi.nlm.nih.gov/41896506/" target="_blank" rel="noopener noreferrer">Hajeer O, Hasan A. In-office tooth bleaching protocols: umbrella review, 2026.</a></li>\n      <li><a href="https://pubmed.ncbi.nlm.nih.gov/42076873/" target="_blank" rel="noopener noreferrer">Basualdo Allende J et al. Laser and light activation in office bleaching: umbrella review, 2026.</a></li>\n      <li><a href="https://pubmed.ncbi.nlm.nih.gov/42501317/" target="_blank" rel="noopener noreferrer">Essai clinique randomisé 2026 sur la sensibilité après blanchiment au fauteuil.</a></li>\n    </ul>\n  </div>\n</section>\n'''
              s = s.replace('</main>', refs + '\n</main>')
          write(p, s)

          # 2) Blog: add practical search questions + remove unconfirmed medical-review attribution.
          p = Path('blog/blanchiment-dentaire-guide/index.html')
          s = read(p)
          s = s.replace(',\"reviewedBy\":{\"@id\":\"https://centredentairevenezuela.com/dr-majda-laasraoui-dentiste-tanger/#person\"}', '')
          s = s.replace('\"author\":{\"@id\":\"https://centredentairevenezuela.com/dr-majda-laasraoui-dentiste-tanger/#person\"}', '\"author\":{\"@type\":\"Organization\",\"name\":\"Centre Dentaire Venezuela\",\"url\":\"https://centredentairevenezuela.com/\"}')
          s = re.sub(r'<p class="evidence" style="margin-top:10px!important">Relecture médicale :.*?</p>', '', s, flags=re.S)
          if 'Questions pratiques souvent recherchées sur Google' not in s:
              qblock = '''\n<div class="callout"><b>Questions pratiques souvent recherchées sur Google</b><p>Le prix d'un blanchiment au Maroc, le coût des gouttières, les kits, la durée du résultat ou le terme « blanchiment flash » reviennent souvent dans les recherches. Ces questions sont utiles, mais elles mélangent des protocoles très différents. Notre page <a href="/blanchiment-dentaire-tanger/" style="text-decoration:underline">Blanchiment dentaire à Tanger</a> répond en détail aux questions de tarif, méthodes, gouttières, produits et devis sans présenter un prix générique comme s'il s'appliquait à tous les patients.</p></div>\n<h2>8. Prix et méthode : pourquoi deux offres de blanchiment ne se comparent pas toujours</h2><p>Un prix affiché seul ne permet pas de savoir si l'offre comprend un bilan, une protection gingivale, un traitement au fauteuil, des gouttières sur mesure, du gel pour plusieurs jours, un détartrage préalable ou un contrôle. Avant de comparer des tarifs, il faut donc comparer le protocole et ce qui est réellement inclus.</p><p>Il faut aussi distinguer le blanchiment des dents naturelles des autres traitements esthétiques. Les couronnes, facettes et composites ne blanchissent pas comme l'émail et la dentine. Si des restaurations sont visibles dans le sourire, la stratégie esthétique peut nécessiter une planification différente.</p>\n'''
              marker = '<div class="cta-box">'
              if marker in s:
                  s = s.replace(marker, qblock + marker, 1)
              else:
                  s = s.replace('</article>', qblock + '</article>')
          write(p, s)

          # 3) Short authority references on specialised treatment pages only.
          refs_by_page = {
            'implant-dentaire-tanger/index.html': ('Références en implantologie', [
              ('https://www.iti.org/resources/proceedings-of-iti-consensus-conferences/', 'International Team for Implantology (ITI), proceedings et consensus cliniques, dont le Global Consensus for Clinical Guidelines 2026.'),
              ('https://pubmed.ncbi.nlm.nih.gov/37750529/', 'ITI Consensus Report sur les protocoles de pose et de mise en charge implantaire.')]),
            'parodontologie-tanger/index.html': ('Références en parodontologie', [
              ('https://www.efp.org/education/continuing-education/clinical-guidelines/', 'European Federation of Periodontology (EFP), recommandations cliniques fondées sur les preuves.'),
              ('https://www.efp.org/news-events/news/perio-workshop-2025-to-address-gingival-and-acute-periodontal-conditions/', 'EFP Perio Workshop 2025, travaux de mise à jour des recommandations sur les maladies gingivales et conditions parodontales aiguës.')]),
            'endodontie-tanger/index.html': ('Références en endodontie', [
              ('https://www.aae.org/specialty/clinical-resources/guidelines-position-statements/', 'American Association of Endodontists (AAE), recommandations et positions cliniques.'),
              ('https://pubmed.ncbi.nlm.nih.gov/41412684/', 'AAE-AAOMR, mise à jour 2025 publiée en 2026 sur l’utilisation du CBCT en endodontie.')]),
            'orthodontie-tanger/index.html': ('Références en orthodontie', [
              ('https://link.springer.com/article/10.1186/s40510-026-00618-1', 'Revue systématique et méta-analyse 2026 sur la prédictibilité de certains mouvements avec aligneurs en dentition permanente.')])
          }
          for path, (title, links) in refs_by_page.items():
              p = Path(path)
              s = read(p)
              if title in s: continue
              lis = ''.join(f'<li><a href="{url}" target="_blank" rel="noopener noreferrer">{label}</a></li>' for url,label in links)
              block = f'''\n<section class="section alt" aria-label="{title}"><div class="inner"><div class="section-head"><span class="kicker">Sources</span><h2>{title}</h2><p class="lead">Sélection courte de références reconnues pour compléter les informations générales de cette page.</p></div><ul class="sources">{lis}</ul></div></section>\n'''
              # ensure source styling if page lacks it
              if '.sources{' not in s:
                  s = s.replace('</style>', '.sources{font-size:13px;line-height:1.7;color:var(--muted)}.sources li{margin:9px 0}.sources a{color:var(--deep);text-decoration:underline;text-underline-offset:3px}\n</style>', 1)
              s = s.replace('</main>', block + '\n</main>')
              write(p, s)

          # 4) Sitemap dates for modified URLs.
          p = Path('sitemap.xml')
          s = read(p)
          urls = [
            '/blanchiment-dentaire-tanger/', '/blog/blanchiment-dentaire-guide/',
            '/implant-dentaire-tanger/', '/parodontologie-tanger/', '/endodontie-tanger/', '/orthodontie-tanger/'
          ]
          for u in urls:
              pattern = rf'(<loc>https://centredentairevenezuela\.com{re.escape(u)}</loc><lastmod>)[^<]+(</lastmod>)'
              s = re.sub(pattern, r'\g<1>2026-09-11\2', s)
          write(p, s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blanchiment-dentaire-tanger/index.html blog/blanchiment-dentaire-guide/index.html implant-dentaire-tanger/index.html parodontologie-tanger/index.html endodontie-tanger/index.html orthodontie-tanger/index.html sitemap.xml
          git commit -m 'Strengthen whitening search coverage and medical references' || exit 0
          git push
