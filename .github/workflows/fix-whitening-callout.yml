name: Fix whitening comparison summary
on:
  push:
    paths:
      - '.github/workflows/fix-whitening-callout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix summary copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('blog/flash-opalescence-philips-zoom-blanchiment/index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="callout"><strong>En bref :</strong> Philips Zoom WhiteSpeed associe gel et lumière LED bleue. Opalescence Pro est chimiquement activé sans lampe. WHITEsmile, qui indique avoir lancé le système premium fläsh en 2016, présente aujourd’hui des protocoles avec et sans lumière. Il n’existe donc pas un “meilleur” système universel.</div>'
          new='<div class="callout"><strong>En bref :</strong> Philips Zoom WhiteSpeed et fläsh Chairside sont des protocoles au fauteuil avec activation lumineuse selon les pages officielles consultées. Le site français Opalescence met surtout en avant des gouttières professionnelles supervisées, notamment Opalescence PF et Opalescence Go. Ces solutions ne se comparent donc pas uniquement par la marque : le lieu du traitement, le gel, la durée, la sensibilité et le diagnostic comptent.</div>'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/flash-opalescence-philips-zoom-blanchiment/index.html
          git commit -m 'Correct whitening comparison summary'
          git push
