name: Align second blog article layout
on:
  push:
    paths:
      - '.github/workflows/align-second-blog-layout.yml'
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match first blog article layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ref = Path('blog/blanchiment-dentaire-guide/index.html').read_text(encoding='utf-8')
          p = Path('blog/flash-opalescence-philips-zoom-blanchiment/index.html')
          s = p.read_text(encoding='utf-8')

          ref_style = re.search(r'<style>(.*?)</style>', ref, re.S).group(1)
          extras = '''\n/* Styles spécifiques au comparatif */\n.article h3{margin:26px 0 9px;font-size:20px}\n.article p a,.article li a{color:var(--deep);text-decoration:underline;text-underline-offset:3px}\nfigure{margin:28px 0;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fbfcfb}\nfigure img{display:block;width:100%;max-height:380px;object-fit:contain;background:#fff}\nfigcaption{margin-top:11px;font-size:12px;line-height:1.55;color:#78908f}\nfigcaption a{color:var(--deep);text-decoration:underline}\n.compare{width:100%;border-collapse:collapse;margin:24px 0}\n.compare th,.compare td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}\n.compare th{background:#f2f7f6;font-size:12px}\n.compare td{font-size:13px;line-height:1.5;color:var(--muted)}\n@media(max-width:700px){.compare th,.compare td{padding:9px 6px}}\n'''
          s = re.sub(r'<style>.*?</style>', '<style>'+ref_style+extras+'</style>', s, count=1, flags=re.S)

          # Same medical-review line and spacing as the first article.
          validation = '<p class="evidence" style="margin-top:10px!important"><strong>Validé médicalement par</strong> <a href="/dr-majda-laasraoui-dentiste-tanger/">Dr Majda Laasraoui, chirurgienne-dentiste à Tanger</a>.</p>'
          if 'Validé médicalement par' not in s:
              s = re.sub(r'(<div class="meta">Publié le 12 septembre 2026</div>)', r'\1'+validation, s, count=1)

          # Align the visible article tag to the first article while keeping comparison semantics in copy/meta.
          s = s.replace('<span class="tag">Esthétique · Comparatif</span>', '<span class="tag">Esthétique</span>')

          # Article schema: same reviewedBy entity relationship as the first article.
          if '"reviewedBy"' not in s:
              s = s.replace('"publisher":{"@id":"https://centredentairevenezuela.com/#dentist"},"about"', '"publisher":{"@id":"https://centredentairevenezuela.com/#dentist"},"reviewedBy":{"@id":"https://centredentairevenezuela.com/dr-majda-laasraoui-dentiste-tanger/#person"},"about"')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/flash-opalescence-philips-zoom-blanchiment/index.html
          git commit -m 'Match second article to blog template'
          git push
