<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Facteurs qui font varier la durée d’un blanchiment dentaire</title><desc id="desc">Illustration des facteurs qui influencent la stabilité de la teinte : teinte de départ, protocole, habitudes, tabac, entretien, restaurations et retouches.</desc><rect width="1400" height="800" rx="36" fill="#fbfcfb"/><text x="90" y="100" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="3" fill="#8fb5b1">POURQUOI LA DURÉE VARIE</text><text x="90" y="160" font-family="Georgia,serif" font-size="48" fill="#143b3e">La tenue dépend du patient et du protocole</text><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(90 245)"><rect width="370" height="180" rx="24" fill="#f2f7f6" stroke="#d6e5e3"/><circle cx="58" cy="58" r="28" fill="#143b3e"/><path d="M47 60c8-17 14-22 22-4 5 11 0 30-9 39-9-9-18-23-13-35z" fill="#fff"/><text x="105" y="58" font-size="22" font-weight="700" fill="#143b3e">Teinte de départ</text><text x="36" y="125" font-size="18" fill="#5d7d7c">Les colorations plus marquées</text><text x="36" y="153" font-size="18" fill="#5d7d7c">peuvent récidiver davantage.</text></g><g transform="translate(515 245)"><rect width="370" height="180" rx="24" fill="#f2f7f6" stroke="#d6e5e3"/><circle cx="58" cy="58" r="28" fill="#2f6d6b"/><path d="M43 58h30M58 43v30" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="105" y="58" font-size="22" font-weight="700" fill="#143b3e">Protocole</text><text x="36" y="125" font-size="18" fill="#5d7d7c">Fauteuil, gouttières ou combinaison :</text><text x="36" y="153" font-size="18" fill="#5d7d7c">la stabilité peut différer.</text></g><g transform="translate(940 245)"><rect width="370" height="180" rx="24" fill="#f2f7f6" stroke="#d6e5e3"/><circle cx="58" cy="58" r="28" fill="#8abdb8"/><path d="M44 55h28M49 47h18M50 63h16" stroke="#143b3e" stroke-width="4" stroke-linecap="round"/><text x="105" y="58" font-size="22" font-weight="700" fill="#143b3e">Habitudes</text><text x="36" y="125" font-size="18" fill="#5d7d7c">Tabac et pigments peuvent participer</text><text x="36" y="153" font-size="18" fill="#5d7d7c">à la recoloration au fil du temps.</text></g><g transform="translate(90 470)"><rect width="370" height="180" rx="24" fill="#fff7ed" stroke="#ecd6b8"/><circle cx="58" cy="58" r="28" fill="#e5bd8c"/><path d="M44 59l9 9 20-23" stroke="#143b3e" stroke-width="5" fill="none" stroke-linecap="round"/><text x="105" y="58" font-size="22" font-weight="700" fill="#143b3e">Suivi</text><text x="36" y="125" font-size="18" fill="#5d7d7c">Une retouche peut suffire :</text><text x="36" y="153" font-size="18" fill="#5d7d7c">pas besoin de tout recommencer.</text></g><g transform="translate(515 470)"><rect width="370" height="180" rx="24" fill="#f2f7f6" stroke="#d6e5e3"/><circle cx="58" cy="58" r="28" fill="#143b3e"/><path d="M45 58c0-10 6-18 13-18s13 8 13 18-6 23-13 30c-7-7-13-20-13-30z" fill="#fff"/><text x="105" y="58" font-size="22" font-weight="700" fill="#143b3e">Restaurations</text><text x="36" y="125" font-size="18" fill="#5d7d7c">Couronnes, facettes et composites</text><text x="36" y="153" font-size="18" fill="#5d7d7c">ne blanchissent pas comme les dents.</text></g><g transform="translate(940 470)"><rect width="370" height="180" rx="24" fill="#f2f7f6" stroke="#d6e5e3"/><circle cx="58" cy="58" r="28" fill="#2f6d6b"/><path d="M44 66c12-20 25-20 29 0M48 50h20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><text x="105" y="58" font-size="22" font-weight="700" fill="#143b3e">Sensibilité</text><text x="36" y="125" font-size="18" fill="#5d7d7c">Elle compte dans le choix</text><text x="36" y="153" font-size="18" fill="#5d7d7c">du protocole et des retouches.</text></g></g></svg>