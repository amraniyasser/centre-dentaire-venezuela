name: Standardize blog article UI
on:
  push:
    paths:
      - '.github/workflows/standardize-blog-article-ui.yml'
permissions:
  contents: write
jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardize blog summary and FAQ
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          css_path = root / 'assets/css/site-shell.css'
          rules_path = root / '.github/project-docs/seo-content-rules.md'
          article1 = root / 'blog/blanchiment-dentaire-guide/index.html'
          article2 = root / 'blog/flash-opalescence-philips-zoom-blanchiment/index.html'

          # 1) Canonical shared blog UI styles: FAQ + top summary.
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Blog article components — canonical FAQ + summary */'
          shared = r'''

/* Blog article components — canonical FAQ + summary */
.blog-summary{margin:34px 0;padding:24px 26px;border-radius:18px;background:#f2f7f6;border:1px solid rgba(20,59,62,.11)}
.blog-summary b{display:block;margin-bottom:8px;color:#143b3e}
.blog-summary p{margin:0;color:#617b7a;font-size:16px;line-height:1.82}
.site-faq{padding:72px 20px;background:#f2f7f6}
.site-faq .faq-inner{max-width:980px;margin:0 auto}
.site-faq .faq-kicker{display:block;margin-bottom:12px;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8fb5b1}
.site-faq h2{margin:0 0 26px;font-size:clamp(30px,4vw,46px);font-weight:300;line-height:1.1;color:#143b3e}
.site-faq details{border-top:1px solid rgba(20,59,62,.11)}
.site-faq details:last-child{border-bottom:1px solid rgba(20,59,62,.11)}
.site-faq summary{cursor:pointer;list-style:none;padding:21px 38px 21px 0;font-size:16px;font-weight:600;color:#143b3e;position:relative}
.site-faq summary::-webkit-details-marker{display:none}
.site-faq summary:after{content:"+";position:absolute;right:4px;top:17px;font-size:24px;font-weight:300;color:#2f6d6b}
.site-faq details[open] summary:after{content:"–"}
.site-faq details p{margin:-3px 0 22px;max-width:820px;font-size:14.5px;line-height:1.72;color:#5d7d7c}
@media(max-width:680px){.site-faq{padding:52px 20px}.site-faq summary{font-size:15px}}
'''
          if marker not in css:
              css = css.rstrip() + shared + '\n'
          css_path.write_text(css, encoding='utf-8')

          # Remove duplicated FAQ CSS from article files now that it is shared.
          faq_css_re = re.compile(
              r'\n?/\* FAQ site-wide \*/\s*'
              r'\.site-faq\{.*?@media\(max-width:680px\)\{\.site-faq\{padding:52px 20px\}\.site-faq summary\{font-size:15px\}\}\s*',
              re.S,
          )

          def canonicalize_faq(s: str, heading: str) -> str:
              # Preserve the topic-specific questions/answers, normalize only wrapper/visual structure.
              m = re.search(r'<section class="(?:faq|site-faq)"[^>]*>.*?</section>', s, re.S)
              if not m:
                  raise RuntimeError('FAQ section not found')
              details = re.findall(r'<details>.*?</details>', m.group(0), re.S)
              if not details:
                  raise RuntimeError('FAQ details not found')
              block = (
                  '<section class="site-faq" data-site-faq="true" aria-labelledby="faq-title">'
                  '<div class="faq-inner">'
                  '<span class="faq-kicker">Questions fréquentes</span>'
                  f'<h2 id="faq-title">{heading}</h2>'
                  + ''.join(details) +
                  '</div></section>'
              )
              return s[:m.start()] + block + s[m.end():]

          # First article: add canonical En bref immediately at start of article body.
          s1 = article1.read_text(encoding='utf-8')
          s1 = faq_css_re.sub('\n', s1)
          summary1 = (
              '<div class="callout blog-summary"><b>En bref</b>'
              '<p>Le blanchiment dentaire doit être personnalisé : une concentration plus élevée, davantage d’applications ou l’ajout d’une lampe ne garantissent pas automatiquement un meilleur résultat final. La sensibilité reste possible et un examen préalable est essentiel pour choisir un protocole adapté.</p></div>'
          )
          if 'class="callout blog-summary"' not in s1:
              anchor = '<article class="article"><div class="wrap">'
              if anchor not in s1:
                  raise RuntimeError('First article body anchor not found')
              s1 = s1.replace(anchor, anchor + '\n' + summary1, 1)
          s1 = canonicalize_faq(s1, 'Questions fréquentes sur le blanchiment dentaire')
          article1.write_text(s1, encoding='utf-8')

          # Second article: normalize existing En bref visual component, preserve SEO copy.
          s2 = article2.read_text(encoding='utf-8')
          s2 = faq_css_re.sub('\n', s2)
          m = re.search(r'<div class="callout(?: blog-summary)?">\s*<(?:strong|b)>En bref\s*:?\s*</(?:strong|b)>(.*?)</div>', s2, re.S | re.I)
          if not m:
              raise RuntimeError('Second article En bref not found')
          body = m.group(1).strip()
          if body.startswith('<p'):
              body_html = body
          else:
              body_html = '<p>' + body + '</p>'
          replacement = '<div class="callout blog-summary"><b>En bref</b>' + body_html + '</div>'
          s2 = s2[:m.start()] + replacement + s2[m.end():]
          s2 = canonicalize_faq(s2, 'Questions sur Zoom, fläsh et Opalescence')
          article2.write_text(s2, encoding='utf-8')

          # 2) Editorial rule: every blog article must use the same FAQ component and En bref block.
          rules = rules_path.read_text(encoding='utf-8')
          section = '''\n\n## Format visuel canonique des articles de blog\n\n- Tous les articles de blog doivent utiliser exactement le même composant FAQ visible : `section.site-faq` > `.faq-inner` > `.faq-kicker` + `h2` + `details`. Le contenu des questions reste spécifique au sujet, mais le format visuel ne varie pas d’un article à l’autre.\n- Le style de la FAQ est centralisé dans `/assets/css/site-shell.css`. Ne pas recopier les règles `.site-faq` dans le `<style>` d’un article.\n- Tous les articles de blog doivent comporter un bloc **« En bref »** visible après l’introduction et avant le développement principal.\n- Le bloc « En bref » utilise le composant partagé `.blog-summary` ; il résume l’article en quelques phrases utiles, sans bourrage de mots-clés ni promesse médicale ou commerciale non vérifiée.\n- Le contenu du bloc « En bref » doit rester cohérent avec les sources et conclusions de l’article.\n'''
          if '## Format visuel canonique des articles de blog' not in rules:
              rules = rules.rstrip() + section + '\n'
          rules_path.write_text(rules, encoding='utf-8')

          # 3) Safety / code-debris audit for blog templates.
          for p in (article1, article2):
              t = p.read_text(encoding='utf-8')
              assert t.count('class="site-faq"') == 1, f'{p}: FAQ wrapper count'
              assert 'data-site-faq="true"' in t, f'{p}: canonical FAQ marker missing'
              assert t.count('class="callout blog-summary"') == 1, f'{p}: En bref count'
              assert '/* FAQ site-wide */' not in t, f'{p}: duplicated FAQ CSS remains'
              assert '/assets/css/site-shell.css' in t, f'{p}: shared stylesheet missing'
              assert '<link rel="canonical"' in t, f'{p}: canonical missing'
              assert 'reviewedBy' in t, f'{p}: medical review schema missing'

          # No temporary workflow/scripts should remain after this run; this workflow removes itself below.
          print('Blog UI standardization + audit passed.')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/standardize-blog-article-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site-shell.css .github/project-docs/seo-content-rules.md blog/blanchiment-dentaire-guide/index.html blog/flash-opalescence-philips-zoom-blanchiment/index.html
          git commit -m 'Standardize blog FAQ and summary components'
          git push
