name: Add blog link

on:
  push:
    paths:
      - '.github/scripts/add_blog_link.py'
      - '.github/workflows/add-blog-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_blog_link.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Blog link to homepage navigation"
          git push
