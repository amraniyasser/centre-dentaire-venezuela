h2>Données techniques</h2><p>Comme tout site web, des informations techniques peuvent être traitées par l’infrastructure d’hébergement, notamment l’adresse IP, le navigateur, le système utilisé, l’heure de la requête et les ressources consultées, notamment à des fins de sécurité et de fonctionnement.</p><h2>Liens externes</h2><p>Le site comporte des liens vers WhatsApp, Google Maps, Instagram, PubMed et d’autres services tiers. Lorsque vous ouvrez ces services, leurs propres politiques de confidentialité s’appliquent.</p><h2>Vos demandes</h2><p>Pour toute question concernant vos données ou pour demander une correction ou une suppression d’informations que vous nous avez directement transmises, écrivez à <a href="mailto:centredentairevenezuela@gmail.com">centredentairevenezuela@gmail.com</a>.</p><p><strong>Dernière mise à jour :</strong> 11 septembre 2026.</p></main><footer class="foot"><span>© 2026 Centre Dentaire Venezuela · Tanger · </span><a href="/mentions-legales/">Mentions légales</a></footer></body></html>'''
