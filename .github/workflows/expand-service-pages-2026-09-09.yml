name: Expand service pages 2026-09-09

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/expand-service-pages-2026-09-09.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expand service pages
        run: python .github/scripts/expand_service_pages_2026_09_09.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soins-dentaires-tanger/index.html chirurgie-dentaire-tanger/index.html dentisterie-esthetique-tanger/index.html endodontie-tanger/index.html parodontologie-tanger/index.html orthodontie-tanger/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Expand service pages to match implant depth"
          git push
