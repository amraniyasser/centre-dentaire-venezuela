name: Editorial review and cannibalization 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/editorial-review-and-cannibalization-2026-09-11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply editorial review and intent separation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('blog/blanchiment-dentaire-guide/index.html')
          s = p.read_text(encoding='utf-8')
          if 'Validé médicalement par' not in s:
              marker = '<div class="meta">Publié le 9 septembre 2026 · Mis à jour le 11 septembre 2026</div>'
              review = marker + '<p class="evidence" style="margin-top:10px!important"><strong>Validé médicalement par</strong> <a href="/dr-majda-laasraoui-dentiste-tanger/">Dr Majda Laasraoui, chirurgienne-dentiste à Tanger</a>.</p>'
              s = s.replace(marker, review, 1)
          if '"reviewedBy":{"@id":"https://centredentairevenezuela.com/dr-majda-laasraoui-dentiste-tanger/#person"}' not in s:
              s = s.replace('"publisher":{"@id":"https://centredentairevenezuela.com/#dentist"},"image"', '"publisher":{"@id":"https://centredentairevenezuela.com/#dentist"},"reviewedBy":{"@id":"https://centredentairevenezuela.com/dr-majda-laasraoui-dentiste-tanger/#person"},"image"', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('.github/project-docs/seo-content-rules.md')
          s = p.read_text(encoding='utf-8')
          if '## Validation médicale obligatoire des articles' not in s:
              s += '''\n\n## Validation médicale obligatoire des articles\n\n- Tout article de blog publié doit afficher visiblement : **« Validé médicalement par Dr Majda Laasraoui, chirurgienne-dentiste à Tanger »**, avec un lien vers `/dr-majda-laasraoui-dentiste-tanger/`.\n- Le balisage `Article` doit inclure `reviewedBy` vers l’entité `https://centredentairevenezuela.com/dr-majda-laasraoui-dentiste-tanger/#person`.\n- Cette validation doit correspondre à une relecture réelle avant publication. Un brouillon non relu ne doit pas être publié avec cette mention.\n- L’auteur éditorial peut rester le Centre Dentaire Venezuela ; la validation médicale est portée séparément par `reviewedBy`.\n'''
          p.write_text(s, encoding='utf-8')

          p = Path('dentisterie-esthetique-tanger/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'Dentisterie esthétique à Tanger : blanchiment, facettes composite ou céramique, couronnes et bridges au Centre Dentaire Venezuela.': 'Dentisterie esthétique à Tanger : facettes composite ou céramique, couronnes, bridges et harmonie du sourire au Centre Dentaire Venezuela.',
            'Au Centre Dentaire Venezuela à Tanger, la dentisterie esthétique vise à améliorer la couleur, la forme, l’harmonie ou la restauration du sourire avec des solutions adaptées à chaque situation : blanchiment, facettes en composite ou en céramique, couronnes et bridges.': 'Au Centre Dentaire Venezuela à Tanger, la dentisterie esthétique vise à améliorer la forme, les proportions, l’harmonie ou la restauration du sourire avec des solutions adaptées à chaque situation : facettes en composite ou en céramique, couronnes et bridges.',
            'La dentisterie esthétique vise à améliorer l’apparence du sourire tout en respectant la santé des dents et des gencives. Le Centre Dentaire Venezuela propose notamment blanchiment, facettes, couronnes, bridges et harmonisation du sourire selon les indications.': 'La dentisterie esthétique vise à améliorer l’apparence du sourire tout en respectant la santé des dents et des gencives. Le Centre Dentaire Venezuela propose notamment facettes, couronnes, bridges et harmonisation du sourire selon les indications. Pour un objectif principalement lié à la couleur des dents naturelles, consultez notre page dédiée au blanchiment dentaire à Tanger.',
            '<span class="motif-chip">Blanchiment dentaire</span>': '<span class="motif-chip">Harmonie du sourire</span>',
            '<h2>Blanchiment ou facettes : <span class="accent">quelle différence ?</span></h2>': '<h2>Éclaircir ou restaurer le sourire : <span class="accent">quelle différence ?</span></h2>'
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"name":"Dentisterie esthétique : blanchiment et facettes"', '"name":"Dentisterie esthétique : facettes, couronnes et harmonie du sourire"')
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/blanchiment-dentaire-guide/index.html .github/project-docs/seo-content-rules.md dentisterie-esthetique-tanger/index.html index.html
          git commit -m 'Add medical review rule and separate aesthetic whitening intent' || exit 0
          git push
