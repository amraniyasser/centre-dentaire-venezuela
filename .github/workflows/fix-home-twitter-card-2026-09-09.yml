name: Fix homepage Twitter card 2026-09-09

on:
  push:
    paths:
      - '.github/workflows/fix-home-twitter-card-2026-09-09.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix homepage metadata
        run: python .github/scripts/fix_home_twitter_card_2026_09_09.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Add Twitter card metadata to homepage" && git push)
