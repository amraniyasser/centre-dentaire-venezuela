name: Add favicon to site pages

on:
  push:
    paths:
      - '.github/scripts/add_favicon.py'
      - '.github/workflows/add-favicon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/add_favicon.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html merci.html */index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add site favicon"
            git push
          fi
