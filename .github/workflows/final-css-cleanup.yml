name: Final CSS cleanup
on:
  push:
    paths:
      - '.github/workflows/final-css-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining legacy header CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Homepage: shared header now lives in assets/css/site-shell.css.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(
              r'/\* ==========================================================================\n   3\. Navbar\n   ========================================================================== \*/.*?(?=/\* ==========================================================================\n   4\. Hero)',
              '', s, flags=re.S)
          p.write_text(s,encoding='utf-8')

          # Inner pages: remove stale responsive rules belonging to the pre-canonical header.
          for p in Path('.').rglob('*.html'):
              if '.github' in p.parts or p.as_posix()=='index.html':
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('.nav a:not(.cta){display:none}\n','')
              s=s.replace('.top .wrap{padding:0 20px}\n','')
              s=re.sub(r'\s*\.brand small\{font-size:8\.5px\}\.brand b\{font-size:16px\}', '', s)
              s=re.sub(r'\s*\.nav \.cta\{height:36px;padding:0 13px;font-size:10px\}', '', s)
              p.write_text(s,encoding='utf-8')

          # Safety: every HTML page still loads the shared shell and contains one canonical footer.
          for p in [x for x in Path('.').rglob('*.html') if '.github' not in x.parts]:
              s=p.read_text(encoding='utf-8')
              assert '/assets/css/site-shell.css' in s, f'missing shell CSS: {p}'
              assert '/assets/js/site-shell.js' in s, f'missing shell JS: {p}'
              assert s.count('class="cv-footer"')==1, f'footer count invalid: {p}'
              if p.as_posix()!='merci.html':
                  assert '<link rel="canonical"' in s, f'canonical missing: {p}'
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove remaining legacy header CSS'
          git push
