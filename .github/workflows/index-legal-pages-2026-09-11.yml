name: Index legal pages
on:
  push:
    paths:
      - '.github/workflows/index-legal-pages-2026-09-11.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make legal pages indexable and add to sitemap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel in ['mentions-legales/index.html','politique-confidentialite/index.html']:
              p=Path(rel)
              s=p.read_text(encoding='utf-8')
              s=s.replace('<meta name="robots" content="noindex, follow">','<meta name="robots" content="index, follow">')
              p.write_text(s,encoding='utf-8')
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          entries='''  <url><loc>https://centredentairevenezuela.com/mentions-legales/</loc><lastmod>2026-09-11</lastmod></url>\n  <url><loc>https://centredentairevenezuela.com/politique-confidentialite/</loc><lastmod>2026-09-11</lastmod></url>\n'''
          if 'https://centredentairevenezuela.com/mentions-legales/' not in s:
              s=s.replace('</urlset>',entries+'</urlset>')
          p.write_text(s,encoding='utf-8')
          assert 'noindex' not in Path('mentions-legales/index.html').read_text(encoding='utf-8')
          assert 'noindex' not in Path('politique-confidentialite/index.html').read_text(encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mentions-legales/index.html politique-confidentialite/index.html sitemap.xml
          git commit -m 'Make legal pages indexable and add to sitemap' || exit 0
          git push
