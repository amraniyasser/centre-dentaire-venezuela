name: Link whitening from esthetic page 2026-09-09
on:
  push:
    paths:
      - '.github/workflows/link-whitening-from-esthetic-2026-09-09.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add internal link
        run: python .github/scripts/link_whitening_from_esthetic_2026_09_09.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dentisterie-esthetique-tanger/index.html
          git diff --cached --quiet || (git commit -m "Link esthetic dentistry page to whitening service" && git push)
